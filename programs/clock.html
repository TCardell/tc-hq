<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TC-HQ / Clock</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet"><style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"VT323","Courier New",monospace;background:radial-gradient(ellipse at 50% 0%,#25161b 0,#090a0d 70%);color:#e5e1e1;display:flex;align-items:center;justify-content:center;text-align:center;padding:15px}.panel{max-width:460px;width:100%;border:1px solid #453438;padding:23px 12px;box-shadow:inset 0 1px #5c353d}.caption{font-size:clamp(17px,3vw,22px);letter-spacing:.2em;color:#acadb0}.time{font-size:clamp(65px,14vw,115px);color:#ed4551;letter-spacing:-.045em;line-height:1.05;font-variant-numeric:tabular-nums;text-shadow:0 0 25px #b1313730}.date{font-size:clamp(23px,5vw,34px);color:#c4c5c7}.rule{height:1px;background:#6d2930;width:150px;margin:18px auto}.muted{color:#949399;font-size:19px}
</style></head><body><section class="panel"><div class="caption">TC-HQ / LOCAL TIME</div><div id="time" class="time">00:00:00</div><div id="date" class="date"></div><div class="rule"></div><div class="muted">TC/OS · <span id="zone"></span></div></section><script>
(()=>{let config={};try{config=JSON.parse(localStorage.getItem('tcos.preferences')||'{}')||{}}catch{}const userLng=['es','en'].includes(config.language)?config.language:(/^es(?:-|$)/i.test(navigator.languages?.[0]||navigator.language)?'es':'en');const lng=userLng==='es'?'es-ES':'en-GB';document.documentElement.lang=userLng;const update=()=>{const now=new Date();document.getElementById('time').textContent=now.toLocaleTimeString('en-GB',{hour12:false});document.getElementById('date').textContent=now.toLocaleDateString(lng,{weekday:'long',day:'numeric',month:'long',year:'numeric'});document.getElementById('zone').textContent=Intl.DateTimeFormat().resolvedOptions().timeZone||'LOCAL'};update();setInterval(update,1000)})();
</script></body></html>
