 clock:`<circle cx="110" cy="72" r="61" fill="#59757d" stroke="#ae875f" stroke-width="7"/><circle cx="110" cy="72" r="47" fill="#e9dbc4"/><path d="M110 31V72L138 88" stroke="#6c5560" stroke-linecap="round" stroke-width="6" fill="none"/><circle cx="110" cy="72" r="6" fill="#b47667"/><g fill="#88694d"><circle cx="110" cy="37" r="3"/><circle cx="145" cy="72" r="3"/><circle cx="110" cy="107" r="3"/><circle cx="75" cy="72" r="3"/></g>`
};
function art(scene){return `<svg viewBox="0 0 220 145" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg"><path d="M21 131 Q110 94 199 131" stroke="#ac8c6d" stroke-width="2" fill="none" opacity=".38"/>${motifs[scene]||motifs.star}</svg>`}
function masthead(){return `<header class="masthead"><div class="brand"><span class="brand-mark" aria-hidden="true">✶</span><span>TYPE<span class="slash">/</span><strong>16</strong></span></div><div class="top-right"><button class="quiet-btn" data-action="language" aria-label="${state.lang==='es'?'Cambiar a inglés':'Switch to Spanish'}">${state.lang.toUpperCase()} <span aria-hidden="true">⇄</span></button><button class="quiet-btn" data-action="settings" aria-label="${W().settings}">${iconGear}</button></div></header>`}
function footer(){return `<footer class="footer">${W().footer}</footer>`}
function intro(){let w=W();return `<section class="intro"><div class="hero-stack" aria-hidden="true"><div class="hero-back"></div><div class="hero-back"></div><div class="hero-front"><span class="hero-front-svg">${art('sun')}</span><span class="serial">ARCANA · XVI</span></div></div><div class="intro-eyebrow">${w.heroEyebrow}</div><h1 class="intro-title">TYPE<span>/</span>16</h1><p class="intro-desc">${w.tagline}</p><p class="intro-desc smaller">${w.intro}</p><button class="start-btn" data-action="start">${state.i>0?w.resume:w.start} <span aria-hidden="true">→</span></button><div class="intro-foot">${w.introSmall}</div></section>`}
function cardHTML(){let q=rawCards[state.i],w=W(),[stem,a,b]=q[state.lang],num=String(state.i+1).padStart(2,'0');return `<div class="card-top"><span>THE DECK · ${num}</span><span class="diamond">✧</span><span>ARCANA / XVI</span></div><div class="card-art">${art(q.scene)}</div><h2 class="card-question" id="card-question">${safe(stem)}</h2><div class="card-options"><div class="option"><span class="ab">A · ←</span><span class="copy">${safe(a)}</span></div><div class="option-mid">✦</div><div class="option"><span class="ab">→ · B</span><span class="copy">${safe(b)}</span></div></div><div class="card-bottom"><span>✧ · TYPE/16</span><span>NO. ${num}</span></div><div id="seal" class="seal" aria-hidden="true"></div>`}
function quiz(){let w=W();return `<section class="stage"><div class="progress-block"><div class="row-between"><span class="progress-label">${w.step} ${String(state.i+1).padStart(2,'0')} <span style="opacity:.5">/ ${String(rawCards.length).padStart(2,'0')}</span></span><span class="section-label">${w.series}</span></div><div class="progress-line"><div class="progress-line-fill" style="width:${(state.i/rawCards.length)*100}%"></div></div></div><div class="deck-area"><div class="deck-layer back" aria-hidden="true"></div><div class="deck-layer mid" aria-hidden="true"></div><article class="card entering" id="card" aria-describedby="card-question">${cardHTML()}</article></div><div class="gesture-zone"><div class="feedback" id="feedback" aria-live="polite">${w.hint}</div><div class="gesture-legend"><span><b>←</b> A · ${w.shortDist}/${w.long}</span><span><b>↑</b> ${w.neutral}</span><span>B · ${w.shortDist}/${w.long} <b>→</b></span></div><div class="response-row" role="group" aria-label="${w.choice}"><button class="response" data-value="1" aria-label="${w.strongA}"><strong>««</strong><small>${w.strongA}</small></button><button class="response" data-value="2" aria-label="${w.softA}"><strong>‹</strong><small>${w.softA}</small></button><button class="response neutral" data-value="3" aria-label="${w.neutral}"><strong>◇</strong><small>${w.neutral}</small></button><button class="response" data-value="4" aria-label="${w.softB}"><strong>›</strong><small>${w.softB}</small></button><button class="response" data-value="5" aria-label="${w.strongB}"><strong>»»</strong><small>${w.strongB}</small></button></div><div class="toolbar"><button class="tool" data-action="undo" ${state.i===0?'disabled':''}><span class="ico">↶</span> ${w.undo}</button><button class="tool" data-action="skip">${w.skip} <span class="ico">↓</span></button></div></div></section>`}
function summary(){let w=W(),a=state.answers.filter(v=>v===1||v===2).length,b=state.answers.filter(v=>v===4||v===5).length,n=state.answers.filter(v=>v===3).length,skips=state.answers.filter(v=>v===null).length;return `<section class="lab-summary"><div class="section-label">TYPE / 16 · INTERACTION LAB</div><div class="summary-panel"><div class="summary-icon">✷</div><h1 class="summary-title">${w.done}</h1><p class="summary-copy">${w.doneSub}</p><div class="summary-stats"><div class="summary-stat"><strong>${a}</strong><span>${w.countA}</span></div><div class="summary-stat"><strong>${b}</strong><span>${w.countB}</span></div><div class="summary-stat"><strong>${n}</strong><span>${w.countN}</span></div></div></div><p class="summary-note">${skips} ${w.skip.toLowerCase()} · ${state.answers.filter(v=>v===1||v===5).length} ${w.strong.toLowerCase()}<br>${w.introSmall}</p><div class="lab-actions"><button class="start-btn" data-action="restart">${w.again} →</button><button class="quiet-btn" data-action="settings">${iconGear} ${w.settings}</button></div></section>`}
function draw(){document.documentElement.lang=state.lang;app.innerHTML=masthead()+(state.i>=rawCards.length?summary():state.started?quiz():intro())+footer();if(state.started&&state.i<rawCards.length)bindPointer();}
function record(value,exitX=0,exitY=0){if(busy)return;busy=true;const el=document.querySelector('#card');const finish=()=>{state.answers[state.i]=value;state.i=Math.min(rawCards.length,state.i+1);persist();busy=false;draw()};if(el){el.classList.remove('dragging','entering');el.classList.add('is-leaving');const x=exitX||((value<=2)?-window.innerWidth:(value>=4?window.innerWidth:0));const y=exitY||((value===null)?window.innerHeight:((value===3)?-window.innerHeight:-window.innerHeight*.12));el.style.transform=`translate3d(${x}px,${y}px,0) rotate(${x>0?19:-19}deg) scale(.95)`;setTimeout(finish,matchMedia('(prefers-reduced-motion:reduce)').matches?15:310)}else finish()}
function classify(dx,dy,threshold){const ax=Math.abs(dx),ay=Math.abs(dy);if(ay>65&&ay>ax*1.18)return{value:dy<0?3:null,text:dy<0?W().neutral:W().skip,side:'neutral'};if(ax<48||ax<ay*1.13)return null;const strong=ax>=threshold,value=dx<0?(strong?1:2):(strong?5:4),side=dx<0?'left':'right';return{value,text:[W().strongA,W().softA,W().neutral,W().softB,W().strongB][value-1],side}}
function bindPointer(){const card=document.querySelector('#card'),seal=document.querySelector('#seal'),fb=document.querySelector('#feedback');if(!card)return;let pos=null,delta={dx:0,dy:0};const cleanup=()=>{pos=null;delta={dx:0,dy:0};card.classList.remove('dragging');card.style.transform='';seal.className='seal';seal.textContent='';fb.classList.remove('highlight');fb.textContent=W().hint};card.addEventListener('pointerdown',e=>{if(busy||e.button!==0)return;pos={x:e.clientX,y:e.clientY,id:e.pointerId};delta={dx:0,dy:0};card.classList.remove('entering');card.classList.add('dragging');card.setPointerCapture(e.pointerId)});card.addEventListener('pointermove',e=>{if(!pos||pos.id!==e.pointerId||busy)return;const dx=e.clientX-pos.x,dy=e.clientY-pos.y;delta={dx,dy};card.style.transform=`translate3d(${dx}px,${dy*.8}px,0) rotate(${Math.max(-16,Math.min(16,dx*.048))}deg) scale(${1-Math.min(.025,(Math.abs(dx)+Math.abs(dy))*.00007)})`;let c=classify(dx,dy,Math.max(100,Math.min(170,Number(state.threshold)||130)));seal.className='seal'+(c?.side==='right'?' right':c?.side==='neutral'?' neutral':'')+(c?' visible':'');seal.textContent=c?c.text:'';fb.classList.toggle('highlight',Boolean(c));fb.textContent=c?c.text:W().hold});card.addEventListener('pointerup',e=>{if(!pos||pos.id!==e.pointerId||busy)return;const c=classify(e.clientX-pos.x,e.clientY-pos.y,Math.max(100,Math.min(170,Number(state.threshold)||130)));const {dx,dy}=delta;pos=null;if(!c){cleanup();return}record(c.value,dx>0?window.innerWidth*1.15:dx<0?-window.innerWidth*1.15:0,dy<0?-window.innerHeight:dy>0?window.innerHeight:-25)});card.addEventListener('pointercancel',cleanup);}
function toggleSettings(open){modal.hidden=!open;if(open){let w=W();document.querySelector('#settings-title').textContent=w.settingsTitle;document.querySelector('#settings-copy').textContent=w.settingsCopy;document.querySelector('#sensitivity-label').textContent=w.sensitivity;document.querySelector('#settings-tip').textContent=w.settingsTip;document.querySelector('#settings-done').textContent=w.settingsDone;document.querySelector('#threshold').value=state.threshold||130;document.querySelector('#threshold-value').textContent=(state.threshold||130)+' px';document.querySelector('#close-settings').focus()}}
app.addEventListener('click',e=>{const b=e.target.closest('[data-action],[data-value]');if(!b||busy)return;if(b.hasAttribute('data-value')){const v=Number(b.dataset.value);record(v);return}switch(b.dataset.action){case'language':state.lang=state.lang==='es'?'en':'es';persist();draw();break;case'start':state.started=true;persist();draw();break;case'settings':toggleSettings(true);break;case'undo':if(state.i>0){state.i--;state.answers.length=state.i;persist();draw()}break;case'skip':record(null);break;case'restart':if(confirm(W().resetQuestion)){state.i=0;state.answers=[];state.started=false;persist();draw()}break;}});
document.querySelector('#threshold').addEventListener('input',e=>{state.threshold=Number(e.target.value);document.querySelector('#threshold-value').textContent=state.threshold+' px';persist()});document.querySelector('#close-settings').addEventListener('click',()=>toggleSettings(false));document.querySelector('#settings-done').addEventListener('click',()=>toggleSettings(false));modal.addEventListener('click',e=>{if(e.target===modal)toggleSettings(false)});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden)toggleSettings(false);if(e.target.matches('input')||!modal.hidden||!state.started||state.i>=rawCards.length||busy)return;const map={ArrowLeft:2,ArrowRight:4,ArrowUp:3,ArrowDown:null,a:1,d:5};if(Object.prototype.hasOwnProperty.call(map,e.key)){e.preventDefault();record(map[e.key])}});
draw();
})();
</script>
