    </div>
    <div class="play-dock"><div class="stage-progress" aria-label="${practice?w.practiceCount:w.stageCount} ${idx}/${rawCards.length}"><span class="deck-counter">${practice?w.practiceCount.toUpperCase():w.stageCount.toUpperCase()} · ${String(idx).padStart(2,'0')}/${String(rawCards.length).padStart(2,'0')}</span><span class="progress-mini"><span style="width:${(idx/rawCards.length)*100}%"></span></span></div>
      <div class="dock-buttons"><button class="dock-btn" data-action="language" aria-label="${w.changeLanguage}">${state.lang.toUpperCase()}</button><button class="dock-btn" data-action="fullscreen" aria-label="${w.full}">⛶</button><button class="dock-btn" data-action="settings" aria-label="${w.settings}">${iconGear}</button></div>
    </div>
  </div></section>`
}
function summary(){let w=W(),a=state.answers.filter(v=>v===1||v===2).length,b=state.answers.filter(v=>v===4||v===5).length,n=state.answers.filter(v=>v===3).length,skips=state.answers.filter(v=>v===null).length;return `<section class="lab-summary"><div class="section-label">TYPE / 16 · INTERACTION LAB</div><div class="summary-panel"><div class="summary-icon">✷</div><h1 class="summary-title">${w.done}</h1><p class="summary-copy">${w.doneSub}</p><div class="summary-stats"><div class="summary-stat"><strong>${a}</strong><span>${w.countA}</span></div><div class="summary-stat"><strong>${b}</strong><span>${w.countB}</span></div><div class="summary-stat"><strong>${n}</strong><span>${w.countN}</span></div></div></div><p class="summary-note">${skips} ${w.skip.toLowerCase()} · ${state.answers.filter(v=>v===1||v===5).length} ${w.strong.toLowerCase()}<br>${w.introSmall}</p><div class="lab-actions"><button class="start-btn" data-action="restart">${w.again} →</button><button class="quiet-btn" data-action="settings">${iconGear} ${w.settings}</button></div></section>`}
function draw(){
  document.documentElement.lang=state.lang;
  const play=state.started && state.i<rawCards.length;
  app.classList.toggle('playing',play);
  document.body.classList.toggle('in-deck',play);
  app.innerHTML=(play?'':masthead())+(state.i>=rawCards.length?summary():play?quiz():intro())+(play?'':footer());
  if(play){bindPointer();if(state.tutorialActive)armPracticeSway();}
}
function armPracticeSway(){
  const card=document.querySelector('#card');
  if(!card||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  setTimeout(()=>{if(card.isConnected && state.tutorialActive && !busy && !card.classList.contains('dragging')){card.classList.remove('entering');card.classList.add('practice-idle')}},1150);
}
function finishPractice(){state.tutorialActive=false;state.tutorialSeen=true;state.started=true;persist();draw()}
function record(value,exitX=0,exitY=0){
  if(busy)return;busy=true;
  const practice=state.tutorialActive,el=document.querySelector('#card');
  const finish=()=>{if(practice)finishPractice();else{state.answers[state.i]=value;state.i=Math.min(rawCards.length,state.i+1);persist();draw()}busy=false};
  if(el){el.classList.remove('dragging','entering','practice-idle');el.classList.add('is-leaving');
    const x=exitX||((value<=2)?-window.innerWidth:(value>=4?window.innerWidth:0));
    const y=exitY||((value===null)?window.innerHeight:((value===3)?-window.innerHeight:-window.innerHeight*.12));
    el.style.transform=`translate3d(${x}px,${y}px,0) rotate(${x>0?19:-19}deg) scale(.95)`;
    setTimeout(finish,matchMedia('(prefers-reduced-motion:reduce)').matches?15:310);
  }else finish();
}
function classify(dx,dy,threshold){
  const ax=Math.abs(dx),ay=Math.abs(dy);
  if(ay>=70 && ay>=ax*1.3)return {value:dy<0?3:null,text:dy<0?W().neutral:W().skip,side:'neutral'};
  if(ax<52 || ax<ay*.7)return null;
  const yInfluence=state.diagonal===false?0:Math.max(-62,Math.min(62,dy*.72));
  const effective=ax+yInfluence, strong=effective>=threshold;
  const value=dx<0?(strong?1:2):(strong?5:4),side=dx<0?'left':'right';
  return {value,text:[W().strongA,W().softA,W().neutral,W().softB,W().strongB][value-1],side,effective,strong};
}
function bindPointer(){
  const card=document.querySelector('#card'),fb=document.querySelector('#feedback'),banner=document.querySelector('#response-banner'),stamp=document.querySelector('#gesture-stamp');
  if(!card)return;
  let pos=null,frame=0,latest=null,lastChoice='';
  const initialHint=state.tutorialActive?W().practiceMessage:W().pickHint;
  const feedback=choice=>{
    const key=choice?String(choice.value):'none';
    if(key===lastChoice)return;
    lastChoice=key;
    fb.textContent=choice?choice.text:initialHint;
    banner.className='response-banner'+(choice?' selected '+(choice.side==='neutral'?'neutral':choice.side)+(choice.strong?' strong':''):'');
    stamp.textContent=choice?choice.text:'';
    stamp.className='gesture-stamp'+(choice?' visible '+(choice.side==='left'?'on-right':choice.side==='right'?'on-left':'on-center')+(choice.strong?' strong':''):'');
  };
  const paint=()=>{
    frame=0;if(!pos||!latest)return;
    const {dx,dy}=latest;
    const dragX=Math.sign(dx)*(Math.min(95,Math.abs(dx))+Math.max(0,Math.abs(dx)-95)*.25);
    const dragY=Math.sign(dy)*(Math.min(80,Math.abs(dy))+Math.max(0,Math.abs(dy)-80)*.2);
    card.style.transform=`translate3d(${dragX}px,${dragY*.8}px,0) rotate(${Math.max(-14,Math.min(14,dragX*.05))}deg)`;
    feedback(classify(dx,dy,Math.max(110,Math.min(210,Number(state.threshold)||150))));
  };
  const cancelFrame=()=>{if(frame){cancelAnimationFrame(frame);frame=0;}};
  const cleanup=()=>{
    cancelFrame();pos=null;latest=null;card.classList.remove('dragging');card.style.transform='';feedback(null);
    if(state.tutorialActive && !matchMedia('(prefers-reduced-motion:reduce)').matches)card.classList.add('practice-idle');
  };
  card.addEventListener('pointerdown',e=>{
    if(busy||e.button!==0||pos)return;
    pos={x:e.clientX,y:e.clientY,id:e.pointerId};latest={dx:0,dy:0};lastChoice='';
    card.classList.remove('entering','practice-idle');card.classList.add('dragging');
    try{card.setPointerCapture(e.pointerId)}catch{}
  });
  card.addEventListener('pointermove',e=>{
    if(!pos||pos.id!==e.pointerId||busy)return;
    const samples=e.getCoalescedEvents?.();const latestEvent=samples?.length?samples[samples.length-1]:e;
    latest={dx:latestEvent.clientX-pos.x,dy:latestEvent.clientY-pos.y};
    if(!frame)frame=requestAnimationFrame(paint);
  },{passive:true});
  card.addEventListener('pointerup',e=>{
    if(!pos||pos.id!==e.pointerId||busy)return;
    cancelFrame();
    const dx=e.clientX-pos.x,dy=e.clientY-pos.y;
    const choice=classify(dx,dy,Math.max(110,Math.min(210,Number(state.threshold)||150)));
    pos=null;latest=null;
    if(!choice){cleanup();return;}
    feedback(choice);
    record(choice.value,dx>0?window.innerWidth*1.15:dx<0?-window.innerWidth*1.15:0,dy<0?-window.innerHeight:dy>0?window.innerHeight:-25);
  });
  card.addEventListener('pointercancel',cleanup);
  card.addEventListener('lostpointercapture',()=>{if(pos&&!busy)cleanup()});
}
function toggleSettings(open){
 modal.hidden=!open;
 if(open){let w=W();
  document.querySelector('#settings-title').textContent=w.settingsTitle;
  document.querySelector('#settings-copy').textContent=w.settingsCopy;
  document.querySelector('#sensitivity-label').textContent=w.sensitivity;
  document.querySelector('#settings-tip').textContent=w.settingsTip;
  document.querySelector('#settings-done').textContent=w.settingsDone;
  document.querySelector('#threshold').value=state.threshold||150;
  document.querySelector('#threshold-value').textContent=(state.threshold||150)+' px';
  document.querySelector('#diagonal-label').textContent=w.diagonalLabel;
  document.querySelector('#diagonal').checked=state.diagonal!==false;
  document.querySelector('#close-settings').focus();
 }
}
function attemptFullscreenOnStart(){
  // Browsers require a user gesture: this runs immediately inside the Start click, not during page load.
  if(document.fullscreenElement||!document.documentElement.requestFullscreen)return;
  try{const p=document.documentElement.requestFullscreen({navigationUI:'hide'});p?.catch?.(()=>{});}catch{}
}
function toggleFullscreen(){
 if(document.fullscreenElement){document.exitFullscreen?.();return;}
 if(document.documentElement.requestFullscreen){
   try{const p=document.documentElement.requestFullscreen({navigationUI:'hide'});
     if(p&&typeof p.catch==='function')p.catch(()=>alert(W().fsHelp));
   }catch{alert(W().fsHelp)}
 }else alert(W().fsHelp);
}

app.addEventListener('click',e=>{const b=e.target.closest('[data-action],[data-value]');if(!b||busy)return;if(b.hasAttribute('data-value')){const v=Number(b.dataset.value);record(v);return}switch(b.dataset.action){case'language':state.lang=state.lang==='es'?'en':'es';persist();draw();break;case'start':attemptFullscreenOnStart();state.tutorialActive=!state.tutorialSeen&&state.i===0;state.started=true;persist();draw();break;case'skip-practice':finishPractice();break;case'fullscreen':toggleFullscreen();break;case'settings':toggleSettings(true);break;case'undo':if(state.i>0){state.i--;state.answers.length=state.i;persist();draw()}break;case'skip':record(null);break;case'restart':if(confirm(W().resetQuestion)){state.i=0;state.answers=[];state.started=false;state.tutorialActive=false;state.tutorialSeen=false;persist();draw()}break;}});
document.querySelector('#diagonal').addEventListener('change',e=>{state.diagonal=e.target.checked;persist()});document.querySelector('#threshold').addEventListener('input',e=>{state.threshold=Number(e.target.value);document.querySelector('#threshold-value').textContent=state.threshold+' px';persist()});document.querySelector('#close-settings').addEventListener('click',()=>toggleSettings(false));document.querySelector('#settings-done').addEventListener('click',()=>toggleSettings(false));modal.addEventListener('click',e=>{if(e.target===modal)toggleSettings(false)});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden)toggleSettings(false);if(e.target.matches('input')||!modal.hidden||!state.started||state.i>=rawCards.length||busy)return;const map={ArrowLeft:2,ArrowRight:4,ArrowUp:3,ArrowDown:null,a:1,d:5};if(Object.prototype.hasOwnProperty.call(map,e.key)){e.preventDefault();record(map[e.key])}});
draw();
})();
</script>
