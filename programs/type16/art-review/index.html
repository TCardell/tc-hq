(async()=>{
 try{
  const encoded=document.getElementById('pack').textContent.trim();
  const bytes=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const pack=JSON.parse(await new Response(stream).text());
  const root='programs/type16/art-review/';
  const files=Object.fromEntries(pack.files.map(f=>[f.path.slice(root.length),f.content]));
  let gallery=files['gallery.html'];
  if(!gallery)throw new Error('Galería ausente');
  for(const [path,source] of Object.entries(files)){
   if(!path.endsWith('.svg'))continue;
   const data='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(source);
   gallery=gallery.replaceAll('src="'+path+'"','src="'+data+'"');
  }
  document.open();document.write(gallery);document.close();
 }catch(error){document.getElementById('loading').textContent='No se pudo abrir esta galería: '+error.message;console.error(error);}
})();
</script></body></html>
