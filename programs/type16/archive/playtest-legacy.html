html{min-height:100%;overscroll-behavior-y:none}
.app{min-height:100dvh}
.app.playing{padding-top:calc(7px + env(safe-area-inset-top));padding-bottom:calc(7px + env(safe-area-inset-bottom));max-width:510px}

.app.playing .deck-layer{inset:14px 14px 14px}
.app.playing .card{border-radius:15px;min-height:0}

.banner-ornament{font:22px Georgia,serif;color:#bda27c}
.banner-text{display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0}

.response-banner.selected.left{background:linear-gradient(120deg,#583844,#242d3b 80%)}
.response-banner.selected.right{background:linear-gradient(120deg,#274a48,#242d3b 80%)}
.response-banner.selected.neutral{background:linear-gradient(120deg,#464253,#242d3b 80%)}
.response-banner.selected.strong{border-color:#f0d39b}

  let w=W(),practice=state.tutorialActive,review=state.session.phase==='review',idx=practice?0:review?state.session.reviewIndex+1:state.i+1,total=review?state.session.reviewQueue.length:(state.session.seen.length<12?12:32);
  return `<section class="stage" aria-label="${w.series}">
  <div class="deck-area"><div class="deck-layer back" aria-hidden="true"></div><div class="deck-layer mid" aria-hidden="true">${reverseFace()}</div>
    <article class="card ${revealNext?'deal-flip':skipNextEntrance?'settled':'entering'}" id="card" aria-describedby="card-question"><div class="card-front">${cardHTML()}<div class="gesture-stamp" id="gesture-stamp" aria-hidden="true"></div></div><div class="card-reverse" aria-hidden="true">${reverseFace()}</div></article></div>
  <div class="gesture-zone">
    <div class="response-banner" id="response-banner" role="status" aria-live="polite" aria-atomic="true">
      <span class="banner-ornament" aria-hidden="true">✦</span><div class="banner-text"><span class="banner-kicker">${practice?w.practiceLabel:w.pick}</span><strong id="feedback">${practice?w.practiceMessage:w.pickHint}</strong></div><span class="banner-ornament" aria-hidden="true">✦</span>
    </div>
    <div class="response-row" role="group" aria-label="${w.choice}">
      <button class="response" data-value="1" aria-label="${w.strongA}"><strong>««</strong><small>${w.strongA}</small></button>
      <button class="response" data-value="2" aria-label="${w.softA}"><strong>‹</strong><small>${w.softA}</small></button>
      <button class="response neutral" data-value="3" aria-label="${w.neutral}"><strong>◇</strong><small>${w.neutral}</small></button>
      <button class="response" data-value="4" aria-label="${w.softB}"><strong>›</strong><small>${w.softB}</small></button>
      <button class="response" data-value="5" aria-label="${w.strongB}"><strong>»»</strong><small>${w.strongB}</small></button>
    </div>
    <div class="toolbar">
      ${practice?`<button class="tool" disabled><span class="ico" aria-hidden="true">↶</span>${w.undo}</button><button class="tool" data-action="skip-practice">${w.practiceSkip}<span class="ico" aria-hidden="true">→</span></button>`:
       `<button class="tool" data-action="undo" ${state.session.undoStack.length===0?'disabled':''}><span class="ico" aria-hidden="true">↶</span>${w.undo}</button><button class="tool" data-action="skip">${w.skip}<span class="ico" aria-hidden="true">↓</span></button>`}
    </div>
    <div class="play-dock"><div class="stage-progress" aria-label="${practice?w.practiceCount:w.stageCount} ${idx}/${total}"><span class="deck-counter">${practice?w.practiceCount.toUpperCase():w.stageCount.toUpperCase()} · ${String(idx).padStart(2,'0')}/${String(total).padStart(2,'0')}</span><span class="progress-mini"><span style="width:${Math.min(100,(idx/total)*100)}%"></span></span></div>
      <div class="dock-buttons"><button class="dock-btn" data-action="language" aria-label="${w.changeLanguage}">${state.lang.toUpperCase()}</button><button class="dock-btn" data-action="fullscreen" aria-label="${w.full}">⛶</button><button class="dock-btn" data-action="settings" aria-label="${w.settings}">${iconGear}</button></div>
    </div>
  </div></section>`
}
function summary(){
 const w=W();
 const report=buildInterpretation(state.session.answers,{locale:state.lang,skipped:state.session.skipped});
 const type=report.brief.type;
 const full=report.status==='full-key',mayContinue=state.session.seen.length<32,mayReview=state.session.skipped.length>0;
 const title=type.title || w.resultNoType;
 const code=type.code && type.status!=='conventional-tie'?type.code:'· · · ·';
 const story=type.readable?type.summary:(type.note||w.resultUnknown);
 const rows=report.dimensions.map(axis=>{
   const position=axis.observedPosition===null?50:Math.max(0,Math.min(100,axis.observedPosition));
   const side=axis.preference?axis.preference:'—';
   return '<div class="result-axis"><div class="result-axis-head"><strong>'+safe(axis.title)+'</strong><span>'+safe(axis.low)+' / '+safe(axis.high)+' · '+axis.answered+'/8 · '+safe(side)+'</span></div>'+
     '<div class="result-track"><i class="result-pointer" style="left:'+position.toFixed(1)+'%"></i></div><p>'+safe(axis.reading)+'</p></div>';
 }).join('');
 return '<section class="lab-summary playtest-results" aria-label="'+safe(w.resultLabel)+'">'+
  '<div class="section-label">TYPE / 16 · '+safe(full?w.resultFull:w.resultQuick)+'</div>'+
  '<div class="result-panel"><div class="result-kicker">'+safe(w.resultLabel)+' · '+report.answered+'/32</div>'+
  '<h1 class="result-code">'+safe(code)+'</h1><h2>'+safe(title)+'</h2><p class="result-story">'+safe(story)+'</p>'+
  '<p class="result-caption">'+safe(type.note)+'</p></div>'+
  '<h2 class="result-heading">'+safe(w.resultDetails)+'</h2><p class="result-description">'+safe(w.resultScale)+'</p>'+
  '<div class="result-axes">'+rows+'</div>'+
  '<p class="result-description">'+safe(w.resultDisclaimer)+' '+safe(w.resultArt)+'</p>'+
  '<div class="lab-actions result-actions">'+
   (mayContinue?'<button class="start-btn" data-action="continue">'+safe(w.resultContinue)+' →</button>':'')+
   (mayReview?'<button class="start-btn result-secondary" data-action="review">'+safe(w.resultReview)+' ('+state.session.skipped.length+')</button>':'')+
   '<button class="quiet-btn" data-action="restart">↺ '+safe(w.again)+'</button></div>'+
 '</section>';
}
function draw(){
  document.documentElement.lang=state.lang;
  const checkpoint=['checkpoint','done'].includes(state.session.phase);
   const play=state.started&&!checkpoint && (state.tutorialActive || nextItem(state.session)!==null);
  app.classList.toggle('playing',play);
  document.body.classList.toggle('in-deck',play);
  document.documentElement.classList.toggle('deck-locked',play);
  app.innerHTML=(play?'':masthead())+(state.started?(checkpoint?summary():play?quiz():intro()):intro())+(play?'':footer());
  if(play){
    bindPointer();
    if(state.tutorialActive)armPracticeSway();
    const card=document.querySelector('#card');
    if(card?.classList.contains('deal-flip')){
      const settle=()=>card.classList.remove('deal-flip');
      card.addEventListener('animationend',event=>{
        if(event.target===card && event.animationName==='tarot-deal-safe')settle();
      });
      window.setTimeout(settle,680); // Cross-browser fallback if animationend never fires.
    }
  }
  revealNext=false;
  skipNextEntrance=false;
}
function armPracticeSway(){
  const card=document.querySelector('#card');
  if(!card||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  setTimeout(()=>{if(card.isConnected && state.tutorialActive && !busy && !card.classList.contains('dragging')){card.classList.remove('entering');card.classList.add('practice-idle')}},1150);
}
function finishPractice(previewAlreadyFlipped=false){state.tutorialActive=false;state.tutorialSeen=true;state.started=true;revealNext=!previewAlreadyFlipped;skipNextEntrance=previewAlreadyFlipped;persist();draw()}

function showChoice(choice,hint=W().pickHint){
  const fb=document.querySelector('#feedback');
  const banner=document.querySelector('#response-banner');
  const stamp=document.querySelector('#gesture-stamp');
  if(!fb||!banner||!stamp)return;
  const active=choice?(choice.value===null?
    document.querySelector('.toolbar [data-action="skip"],.toolbar [data-action="skip-practice"]'):
    document.querySelector('.response[data-value="'+choice.value+'"]')):null;
  document.querySelectorAll('.response.gesture-active,.toolbar .tool.gesture-active').forEach(button=>{
    if(button!==active)button.classList.remove('gesture-active');
  });
  if(active)active.classList.add('gesture-active'); console.log('showChoice',choice?.value,active?.dataset?.value||active?.dataset?.action,[...document.querySelectorAll('.gesture-active')].map(x=>x.dataset.value||x.dataset.action));
  fb.textContent=choice?choice.text:hint;
  const side=choice?.side==='left'?'choice-a':choice?.side==='right'?'choice-b':'neutral';
  banner.className='response-banner'+(choice?' selected '+side+(choice.strong?' strong':''):'');
  stamp.textContent=choice?choice.text:'';
  stamp.className='gesture-stamp'+(choice?' visible '+(choice.side==='left'?'on-right choice-a':choice.side==='right'?'on-left choice-b':'on-center')+(choice.strong?' strong':''):'');
}

function record(value,exitX=0,exitY=0){
  if(busy)return;
  busy=true;
  const practice=state.tutorialActive;
  const card=document.querySelector('#card');
  const label=value===null?W().skip:[W().strongA,W().softA,W().neutral,W().softB,W().strongB][value-1];
  showChoice({value,text:label,side:value===1||value===2?'left':value===4||value===5?'right':'neutral',strong:value===1||value===5});
  const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const pendingSession=practice?null:transition(state.session,{type:'respond',id:nextItem(state.session),value});
   const nextIndex=practice?state.i:pendingSession.seen.length;
   const hasNext=practice?true:nextItem(pendingSession)!==null;
  let completed=false,previewStarted=false,previewAt=0,previewTimer=0;
  const beginPreview=()=>{
    previewTimer=0;
    if(completed||!hasNext||!card?.isConnected||reduced)return;
    const deck=document.querySelector('.deck-area');
    if(!deck)return;
    const upcoming=document.createElement('article');
    upcoming.className='card deal-flip incoming-preview';
    upcoming.setAttribute('aria-hidden','true');
    upcoming.innerHTML='<div class="card-front">'+cardHTML(nextIndex,false,true,practice?state.session:pendingSession)+'</div><div class="card-reverse" aria-hidden="true">'+reverseFace()+'</div>';
    upcoming.style.width=card.offsetWidth+'px';
    upcoming.style.height=card.offsetHeight+'px';
    upcoming.style.left=((deck.clientWidth-card.offsetWidth)/2)+'px';
    upcoming.style.top=((deck.clientHeight-card.offsetHeight)/2)+'px';
    deck.appendChild(upcoming);
    previewStarted=true;
    previewAt=performance.now();
  };
  const advance=()=>{
    if(practice)finishPractice(previewStarted);
    else{
      state.session=pendingSession;
       state.i=state.session.seen.length;
       revealNext=hasNext&&!previewStarted;
      skipNextEntrance=previewStarted;
      persist();draw();
    }
    busy=false;
  };
  const finish=()=>{
    if(completed)return;
    completed=true;
    if(previewTimer){clearTimeout(previewTimer);previewTimer=0;}
    if(card)card.style.visibility='hidden';
    const wait=reduced?0:previewStarted?
      Math.max(15,640-(performance.now()-previewAt)):105;
    window.setTimeout(advance,wait);
  };
  if(!card){finish();return;}
  const startTransform=getComputedStyle(card).transform;
  card.classList.remove('dragging','entering','deal-flip','practice-idle');
  const deck=document.querySelector('.deck-area').getBoundingClientRect();
  const cardWidth=card.offsetWidth,cardHeight=card.offsetHeight;
  const cardLeft=deck.left+(deck.width-cardWidth)/2;
  const cardRight=cardLeft+cardWidth;
  const cardTop=deck.top+(deck.height-cardHeight)/2;
  const cardBottom=cardTop+cardHeight;
  const x=value===3||value===null?0:value<=2?
    -Math.ceil(cardRight+48):Math.ceil(window.innerWidth-cardLeft+48);
  const y=value===null?Math.ceil(window.innerHeight-cardTop+48):
    value===3?-Math.ceil(cardBottom+48):
    exitY===0?-36:Math.max(-125,Math.min(125,exitY));
  const finalTransform=`translate3d(${x}px,${y}px,0) rotate(${x===0?0:x>0?17:-17}deg) scale(.96)`;
  const duration=Math.round(Math.max(540,Math.min(780,330+Math.hypot(x,y)*.43)));
  if(reduced||!card.animate){card.style.transform=finalTransform;finish();return;}
  try{
    const anim=card.animate([
      {transform:startTransform==='none'?'translate3d(0,0,0)':startTransform,opacity:1},
      {transform:finalTransform,opacity:0}
    ],{duration,easing:'cubic-bezier(.22,.65,.28,1)',fill:'forwards'});
    if(hasNext)previewTimer=window.setTimeout(beginPreview,Math.max(0,duration-500));
    anim.finished.then(finish,finish);
    window.setTimeout(finish,duration+240);
  }catch{card.style.transform=finalTransform;finish();}
}

function classify(dx,dy,threshold){
  const ax=Math.abs(dx),ay=Math.abs(dy);
  if(ay>=70 && ay>=ax*1.3)return {value:dy<0?3:null,text:dy<0?W().neutral:W().skip,side:'neutral'};
  if(ax<52 || ax<ay*.7)return null;
  const yInfluence=state.diagonal===false?0:Math.max(-62,Math.min(62,dy*.72));
  const effective=ax+yInfluence, strong=effective>=threshold;
  const value=dx<0?(strong?1:2):(strong?5:4),side=dx<0?'left':'right';
  return {value,text:[W().strongA,W().softA,W().neutral,W().softB,W().strongB][value-1],side,effective,strong};
}
function bindPointer(){
  const card=document.querySelector('#card'),fb=document.querySelector('#feedback'),banner=document.querySelector('#response-banner'),stamp=document.querySelector('#gesture-stamp');
  if(!card)return;
  let pos=null,frame=0,latest=null,lastChoice='';
  const initialHint=state.tutorialActive?W().practiceMessage:W().pickHint;
  const feedback=choice=>{
    const key=choice?String(choice.value):'none';
    if(key===lastChoice)return;
    lastChoice=key;
    showChoice(choice,initialHint);
  };
  const paint=()=>{
    frame=0;if(!pos||!latest)return;
    const {dx,dy}=latest;
    const dragX=Math.sign(dx)*(Math.min(95,Math.abs(dx))+Math.max(0,Math.abs(dx)-95)*.25);
    const dragY=Math.sign(dy)*(Math.min(80,Math.abs(dy))+Math.max(0,Math.abs(dy)-80)*.2);
    card.style.transform=`translate3d(${dragX}px,${dragY*.8}px,0) rotate(${Math.max(-14,Math.min(14,dragX*.05))}deg)`;
    feedback(classify(dx,dy,Math.max(110,Math.min(210,Number(state.threshold)||150))));
  };
  const cancelFrame=()=>{if(frame){cancelAnimationFrame(frame);frame=0;}};
  const cleanup=()=>{
    cancelFrame();pos=null;latest=null;card.classList.remove('dragging');card.style.transform='';feedback(null);
    if(state.tutorialActive && !matchMedia('(prefers-reduced-motion:reduce)').matches)card.classList.add('practice-idle');
  };
  const deck=card.closest('.deck-area');
  deck.addEventListener('selectstart',event=>event.preventDefault());
  deck.addEventListener('dragstart',event=>event.preventDefault());
  card.addEventListener('pointerdown',e=>{
    if(busy||e.button!==0||pos)return;
    e.preventDefault();
    if(window.getSelection()?.rangeCount)window.getSelection().removeAllRanges();
    pos={x:e.clientX,y:e.clientY,id:e.pointerId};latest={dx:0,dy:0};lastChoice='';
    // Interrupt the deal animation cleanly: its CSS fill mode otherwise overrides
    // inline translate3d() and makes all subsequent cards appear undraggable.
    card.classList.remove('entering','deal-flip','practice-idle');
    card.classList.add('dragging');
    try{card.setPointerCapture(e.pointerId)}catch{}
  });
  card.addEventListener('pointermove',e=>{
    if(!pos||pos.id!==e.pointerId||busy)return;
    const samples=e.getCoalescedEvents?.();const latestEvent=samples?.length?samples[samples.length-1]:e;
    latest={dx:latestEvent.clientX-pos.x,dy:latestEvent.clientY-pos.y};
    if(!frame)frame=requestAnimationFrame(paint);
  },{passive:true});
  card.addEventListener('pointerup',e=>{
    if(!pos||pos.id!==e.pointerId||busy)return;
    cancelFrame();
    const dx=e.clientX-pos.x,dy=e.clientY-pos.y;
    const choice=classify(dx,dy,Math.max(110,Math.min(210,Number(state.threshold)||150)));
    pos=null;latest=null;
    if(!choice){cleanup();return;}
    feedback(choice);
    record(choice.value,dx,dy);
  });
  card.addEventListener('pointercancel',cleanup);
  card.addEventListener('lostpointercapture',()=>{if(pos&&!busy)cleanup()});
}
function toggleSettings(open){
 modal.hidden=!open;
 if(open){let w=W();
  document.querySelector('#settings-title').textContent=w.settingsTitle;
  document.querySelector('#settings-copy').textContent=w.settingsCopy;
  document.querySelector('#sensitivity-label').textContent=w.sensitivity;
  document.querySelector('#settings-tip').textContent=w.settingsTip;
  document.querySelector('#settings-done').textContent=w.settingsDone;
  document.querySelector('#threshold').value=state.threshold||150;
  document.querySelector('#threshold-value').textContent=(state.threshold||150)+' px';
  document.querySelector('#diagonal-label').textContent=w.diagonalLabel;
  document.querySelector('#diagonal').checked=state.diagonal!==false;
  document.querySelector('#close-settings').focus();
 }
}
function attemptFullscreenOnStart(){
  // Browsers require a user gesture: this runs immediately inside the Start click, not during page load.
  if(document.fullscreenElement||!document.documentElement.requestFullscreen)return;
  try{const p=document.documentElement.requestFullscreen({navigationUI:'hide'});p?.catch?.(()=>{});}catch{}
}
function toggleFullscreen(){
 if(document.fullscreenElement){document.exitFullscreen?.();return;}
 if(document.documentElement.requestFullscreen){
   try{const p=document.documentElement.requestFullscreen({navigationUI:'hide'});
     if(p&&typeof p.catch==='function')p.catch(()=>alert(W().fsHelp));
   }catch{alert(W().fsHelp)}
 }else alert(W().fsHelp);
}

app.addEventListener('click',e=>{
  const b=e.target.closest('[data-action],[data-value]');if(!b||busy)return;
  if(b.hasAttribute('data-value')){record(Number(b.dataset.value));return}
  switch(b.dataset.action){
   case'language':state.lang=state.lang==='es'?'en':'es';state.session=transition(state.session,{type:'language',locale:state.lang});persist();draw();break;
   case'start':attemptFullscreenOnStart();state.tutorialActive=!state.tutorialSeen&&state.i===0;state.started=true;persist();draw();break;
   case'skip-practice':finishPractice();break;
   case'fullscreen':toggleFullscreen();break;
   case'settings':toggleSettings(true);break;
   case'undo':if(state.session.undoStack.length){state.session=transition(state.session,{type:'undo'});state.i=state.session.seen.length;persist();draw()}break;
   case'skip':record(null);break;
   case'continue':state.session=transition(state.session,{type:'continue'});state.i=state.session.seen.length;state.started=true;revealNext=true;persist();draw();break;
   case'review':state.session=transition(state.session,{type:'review'});state.i=state.session.seen.length;state.started=true;revealNext=true;persist();draw();break;
   case'restart':if(confirm(W().resetQuestion)){const lang=state.lang,threshold=state.threshold,diagonal=state.diagonal;state={v:6,lang,i:0,threshold,diagonal,started:false,tutorialSeen:false,tutorialActive:false,session:createSession({locale:lang})};persist();draw()}break;
  }
});
document.querySelector('#diagonal').addEventListener('change',e=>{state.diagonal=e.target.checked;persist()});document.querySelector('#threshold').addEventListener('input',e=>{state.threshold=Number(e.target.value);document.querySelector('#threshold-value').textContent=state.threshold+' px';persist()});document.querySelector('#close-settings').addEventListener('click',()=>toggleSettings(false));document.querySelector('#settings-done').addEventListener('click',()=>toggleSettings(false));modal.addEventListener('click',e=>{if(e.target===modal)toggleSettings(false)});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden)toggleSettings(false);if(e.target.matches('input')||!modal.hidden||!state.started||nextItem(state.session)===null||busy)return;const map={ArrowLeft:2,ArrowRight:4,ArrowUp:3,ArrowDown:null,a:1,d:5};if(Object.prototype.hasOwnProperty.call(map,e.key)){e.preventDefault();record(map[e.key])}});
draw();
})();
</script>
