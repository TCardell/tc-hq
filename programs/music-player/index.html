<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TC-HQ Music Player</title><link href="../app-shell.css?v=174" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet"><script type="module" src="../app-theme.js?v=174"></script><style>.player{max-width:580px;margin:auto}.disc{font:64px VT323,monospace;color:var(--accent);border:1px solid var(--border);background:var(--surface);height:94px;display:grid;place-items:center}.player-controls{display:flex;gap:7px;align-items:center;justify-content:center}.player-controls button{font-size:19px;min-width:53px}.track{width:100%;text-align:left;padding:9px;white-space:normal}.track.active{border-color:var(--accent);background:var(--accent-dark)}.list{max-height:210px;overflow:auto}.row label{font-size:12px}input[type=file]{background:transparent}</style></head><body><main class="player stack"><h1>TC-HQ MEDIA PLAYER</h1><div class="disc">♪</div><div class="row"><strong class="fill" id="track-title">NO TRACK LOADED</strong><span id="elapsed" class="mono muted">00:00 / 00:00</span></div><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Posición"><div class="player-controls"><button id="prev" title="Anterior">⏮</button><button id="play" title="Reproducir/Pausar">▶</button><button id="next" title="Siguiente">⏭</button><button id="stop" title="Detener">■</button></div><div class="row"><label for="volume">Volumen</label><input id="volume" class="fill" type="range" min="0" max="100" value="65"><span id="volume-num">65%</span></div><label class="muted">Añadir archivos de audio (solo en este navegador):<input type="file" id="choose" accept="audio/*" multiple></label><div class="row"><strong>PLAYLIST</strong><button id="clear" style="margin-left:auto">Limpiar lista</button></div><div id="playlist" class="list stack"></div><div class="status" id="msg"></div><audio id="audio" preload="metadata"></audio></main><script>
let mediaPrefs={};try{mediaPrefs=JSON.parse(localStorage.getItem('tcos.preferences')||'{}')||{}}catch{}const mediaLang=['es','en'].includes(mediaPrefs.language)?mediaPrefs.language:(/^es(?:-|$)/i.test(navigator.language)?'es':'en');document.documentElement.lang=mediaLang;const ml=(es,en)=>mediaLang==='en'?en:es;
const audio=document.getElementById('audio'),play=document.getElementById('play'),seek=document.getElementById('seek'),list=document.getElementById('playlist'),title=document.getElementById('track-title'),msg=document.getElementById('msg');let tracks=[],idx=-1;const urls=[];

const localizeMedia=()=>{
 document.querySelector('label[for="volume"]').textContent=ml('Volumen','Volume');
 document.querySelector('label[for="volume"]').setAttribute('for','volume');
 document.getElementById('clear').textContent=ml('Limpiar lista','Clear list');
 const picker=document.getElementById('choose').closest('label');if(picker){picker.firstChild.textContent=ml('Añadir archivos de audio: ','Add audio files: ')}
 const labels={prev:['Anterior','Previous'],play:['Reproducir / Pausar','Play / Pause'],next:['Siguiente','Next'],stop:['Detener','Stop'],seek:['Posición','Position']};
 for(const[id,names]of Object.entries(labels)){const n=document.getElementById(id);if(n){n.title=ml(...names);n.setAttribute('aria-label',ml(...names))}}
};localizeMedia();

function fmt(v){if(!Number.isFinite(v))return '00:00';return String(Math.floor(v/60)).padStart(2,'0')+':'+String(Math.floor(v%60)).padStart(2,'0')}
function repaint(){list.replaceChildren();tracks.forEach((t,i)=>{const b=document.createElement('button');b.className='track'+(i===idx?' active':'');b.textContent=(i+1)+'. '+t.name;b.onclick=()=>choose(i,true);list.append(b)})}
function choose(i,auto=false){if(!tracks.length)return;idx=(i+tracks.length)%tracks.length;audio.src=tracks[idx].url;title.textContent=tracks[idx].name;repaint();if(auto)audio.play().catch(()=>msg.textContent=ml('Reproducción pendiente. Pulsa ▶ de nuevo.','Playback pending. Press ▶ again.'));play.textContent=auto?'Ⅱ':'▶'}
play.onclick=()=>{if(idx<0){if(tracks.length)choose(0,true);return}if(audio.paused)audio.play().catch(()=>msg.textContent=ml('No se pudo reproducir.','Could not play audio.'));else audio.pause()};document.getElementById('prev').onclick=()=>choose(idx<=0?tracks.length-1:idx-1,true);document.getElementById('next').onclick=()=>choose(idx+1,true);document.getElementById('stop').onclick=()=>{audio.pause();audio.currentTime=0};audio.onplay=()=>play.textContent='Ⅱ';audio.onpause=()=>play.textContent='▶';audio.onended=()=>tracks.length>1?choose(idx+1,true):audio.pause();
audio.ontimeupdate=()=>{seek.value=audio.duration?Math.round(audio.currentTime/audio.duration*1000):0;document.getElementById('elapsed').textContent=fmt(audio.currentTime)+' / '+fmt(audio.duration)};seek.oninput=()=>{if(audio.duration)audio.currentTime=audio.duration*(seek.value/1000)};function masterVolume(){try{let p=JSON.parse(localStorage.getItem('tcos.preferences')||'{}');return Math.max(0,Math.min(100,Number(p.volume??100)))/100}catch{return 1}}
function applyVolume(){audio.volume=Math.max(0,Math.min(1,Number(document.getElementById('volume').value)/100*masterVolume()))}
document.getElementById('volume').oninput=e=>{applyVolume();document.getElementById('volume-num').textContent=e.target.value+'%'};window.addEventListener('storage',e=>{if(e.key==='tcos.preferences')applyVolume()});applyVolume();
document.getElementById('choose').onchange=e=>{for(const f of e.target.files){const u=URL.createObjectURL(f);urls.push(u);tracks.push({name:f.name,url:u})}repaint();if(idx<0&&tracks.length)choose(0)};document.getElementById('clear').onclick=()=>{audio.pause();audio.removeAttribute('src');audio.load();for(const u of urls)URL.revokeObjectURL(u);urls.length=0;tracks=[];idx=-1;title.textContent='NO TRACK LOADED';repaint()};
fetch('../../media/playlist.json?v=174',{cache:'no-store'}).then(r=>r.ok?r.json():[]).then(a=>{if(Array.isArray(a)){for(const t of a){if(t&&typeof t.name==='string'&&typeof t.file==='string'&&/^[-\w./ ]+\.(?:mp3|ogg|wav|m4a)$/i.test(t.file)&&!t.file.includes('..'))tracks.push({name:t.name,url:new URL('../../media/'+t.file,location.href).href})}repaint()}}).catch(()=>{});
</script></body></html>
