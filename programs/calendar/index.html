<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TC/OS Calendar</title><link href="../app-shell.css?v=174" rel="stylesheet"><script type="module" src="../app-theme.js?v=174"></script><style>.calendar{max-width:460px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.day,.dow{display:grid;place-items:center;min-height:36px}.dow{color:var(--muted)}.day{background:var(--surface-raised);border:1px solid var(--border);padding:4px}.day.today{border-color:var(--accent)}.day.selected{background:var(--accent-dark);color:white}.day:disabled{visibility:hidden}@media(max-width:400px){body{padding:8px}.day,.dow{min-height:32px}}</style></head><body><div class="calendar"><h1>TC/OS CALENDAR</h1><div class="head"><button id="prev" aria-label="Mes anterior">‹</button><strong id="month"></strong><button id="next" aria-label="Mes siguiente">›</button></div><div id="grid" class="grid"></div><p id="selected" class="muted"></p><button id="today">Hoy / Today</button></div><script type="module">
const now=new Date();let y=now.getFullYear(),m=now.getMonth(),chosen=now.getDate();let pref={};try{pref=JSON.parse(localStorage.getItem('tcos.preferences')||'{}')||{}}catch{}const lang=pref.language==='es'||pref.language==='en'?pref.language:navigator.language;const loc=lang==='en'?'en-GB':lang==='es'?'es-ES':/^es/i.test(lang)?'es-ES':'en-GB';const monday=pref.weekStart!=='sunday';document.documentElement.lang=loc==='en-GB'?'en':'es';document.getElementById('today').textContent=loc==='en-GB'?'Today':'Hoy';document.getElementById('prev').setAttribute('aria-label',loc==='en-GB'?'Previous month':'Mes anterior');document.getElementById('next').setAttribute('aria-label',loc==='en-GB'?'Next month':'Mes siguiente');
const grid=document.getElementById('grid'),title=document.getElementById('month'),selected=document.getElementById('selected');
function render(){grid.replaceChildren();title.textContent=new Date(y,m,1).toLocaleDateString(loc,{month:'long',year:'numeric'});const labels=loc==='en-GB'?(monday?['Mo','Tu','We','Th','Fr','Sa','Su']:['Su','Mo','Tu','We','Th','Fr','Sa']):(monday?['L','M','X','J','V','S','D']:['D','L','M','X','J','V','S']);for(const label of labels){const x=document.createElement('div');x.className='dow';x.textContent=label;grid.append(x)}const offset=(new Date(y,m,1).getDay()+(monday?6:0))%7;for(let k=0;k<offset;k++){let b=document.createElement('button');b.className='day';b.disabled=true;grid.append(b)}for(let n=1;n<=new Date(y,m+1,0).getDate();n++){let b=document.createElement('button');b.textContent=n;b.className='day'+(n===chosen?' selected':'')+(n===now.getDate()&&m===now.getMonth()&&y===now.getFullYear()?' today':'');b.onclick=()=>{chosen=n;render()};grid.append(b)}selected.textContent=chosen?new Date(y,m,chosen).toLocaleDateString(loc,{weekday:'long',day:'numeric',month:'long',year:'numeric'}):''}
function change(n){m+=n;if(m<0){m=11;y--}if(m>11){m=0;y++}chosen=null;render()}document.getElementById('prev').onclick=()=>change(-1);document.getElementById('next').onclick=()=>change(1);document.getElementById('today').onclick=()=>{y=now.getFullYear();m=now.getMonth();chosen=now.getDate();render()};render();
</script></body></html>
