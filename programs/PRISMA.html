function enrichCase(c){const fresh=CASE_BANK.find(x=>x.id===c.id);const extra=CHALLENGES[c.id];if(!fresh)return;c.challenge=extra||null;c.brief=extra?L(fresh.brief.es+' '+extra.append.es,fresh.brief.ca+' '+extra.append.ca):fresh.brief;if(!Array.isArray(c.askedQuestions))c.askedQuestions=[];if(c.recommended===undefined)c.recommended=null;if(c.hintUsed===undefined)c.hintUsed=false;}
function askedCorrect(c){return c.challenge?.kind==='ask'&&c.askedQuestions?.includes(c.challenge.correct)}
function compareDifferent(c){
 if(c.variants.length<2)return false;
 const a=c.variants[0].spec,b=c.variants[1].spec;
 // Si el cliente pide comparar materiales/acabados, cambiar solo un parámetro comercial no basta.
 const keys=['f03','t02','b03'].includes(c.id)?['stock','finish']:['size','stock','ink','sides','finish','pages','method'];
 if(keys.some(k=>String(a[k])!==String(b[k])))return true;
 return !['f03','t02','b03'].includes(c.id)&&quote(a).method!==quote(b).method;
}
function neededSpecs(s){return ['product','quantity','size','stock','ink','sides','finish','method','fileService','delivery','rush','margin',...(s.product==='booklet'?['pages']:[])].filter(k=>String(s[k]??'').trim()==='');}
function newSpec(c,ideal=false){
 const p=PRODUCTS[c.product],d=p.default;
 let stock=ideal?(c.eco?(c.product==='card'?'rec300':'rec120'):c.outdoor?'synth200':c.premium?(c.product==='card'?'card350':c.product==='trifold'?'coated250':c.product==='booklet'?'book115':c.product==='flyer'?'coated170':STOCK_DEFAULT[c.product]):STOCK_DEFAULT[c.product]):'';
 let finish=ideal?(c.finish||(c.product==='trifold'?(STOCKS[stock].gsm>=200?'crease':'fold'):c.product==='booklet'?'staple':c.premium&&c.product==='card'?'matte':'none')):'';
 return {product:ideal?c.product:'',quantity:ideal?c.qty:'',size:ideal?(c.size||d.size):'',stock,ink:ideal?(c.color?'color':'bw'):'',sides:ideal?(c.both?2:(p.sides.includes(1)?1:2)):'',finish,method:ideal?(c.qty>900&&c.product!=='poster'?'offset':'digital'):'',fileService:ideal?(c.file==='missing'?'design':c.file==='review'?'check':'none'):'',delivery:c.shipping&&ideal?'courier':'',rush:ideal?false:'',pages:ideal?(c.pages||16):'',margin:ideal?28:'',discount:0,note:''};
}
function perA3(product,size,pages){
 if(product==='card')return 12;
 if(product==='flyer')return ({A6:4,A5:2,A4:1}[size]||2);
 if(product==='trifold')return String(size).startsWith('A3')?.5:1;
 if(product==='poster')return ({A3:1,A2:.5,A1:.25}[size]||1);
 if(product==='booklet')return String(size).startsWith('A4')?4/Math.max(4,pages):8/Math.max(4,pages);
 return 1;
}
function quote(spec){
 const p=PRODUCTS[spec.product];if(!p)return null;
 const n={...spec};
 if(!n.size)n.size=p.default.size||p.sizes[0];
 if(!n.stock)n.stock=p.stocks[0];
 if(!n.ink)n.ink='color';
 if(!n.sides)n.sides=p.sides[0];
 if(!n.finish)n.finish=p.default.finish||p.finishes[0];
 if(!n.fileService)n.fileService='none';
 if(!n.delivery)n.delivery='pickup';
 if(!n.method)n.method='auto';
 const qty=clamp(Math.round(Number(n.quantity)||1),1,50000),stock=STOCKS[n.stock]||STOCKS[p.stocks[0]],method=n.method==='auto'?(qty>900&&n.product!=='poster'?'offset':'digital'):n.method;
 const tech=(PRODUCTION[method]||PRODUCTION.digital);const ink=n.ink==='bw'?'bw':'color';const factor=perA3(n.product,n.size,n.pages);
 const baseSheets=qty/factor,physicalSheets=baseSheets*(1+tech.waste),sides=n.product==='booklet'?2:Number(n.sides||1);
 const fileFee={none:0,check:7,adapt:29,design:78}[n.fileService]||0;
 const prep=tech.prep+fileFee+8;
 const paper=physicalSheets*stock.cost+(n.product==='booklet'?qty*.085:0);
 const print=baseSheets*(ink==='color'?tech.inkColor:tech.inkMono)*sides+(n.product==='poster'?qty*.09:0);
 const fixedFinish=n.finish==='none'?0:({matte:.055,gloss:.052,round:.048,fold:.08,crease:.13,weather:.16,staple:.19,spiral:.52}[n.finish]||0)*qty;
 const extraFinish=qty*(n.product==='card'?.018:n.product==='booklet'?.035:.013);
 const fin=fixedFinish+extraFinish;
 const dispatch=7+qty*.003+(n.delivery==='courier'?qty>2000?24:13:0);
 const subtotal=prep+paper+print+fin+dispatch;
 const rushExtra=n.rush?subtotal*.23:0;
 const totalCost=subtotal+rushExtra;
 const intendedMargin=clamp(Number(n.margin)||0,0,70);
 const baseSale=totalCost/(1-intendedMargin/100);
 const sale=baseSale*(1-clamp(Number(n.discount)||0,0,50)/100),vat=sale*.21,gross=sale+vat;
 let days=tech.days+(n.product==='booklet'||n.product==='trifold'?1:0)+(qty>3000?1:0)+(n.finish==='matte'||n.finish==='gloss'||n.finish==='weather'?1:0)+(n.fileService==='design'?2:n.fileService==='adapt'?1:0)+(n.delivery==='courier'?1:0)-(n.rush?1:0);
 days=Math.max(1,days);
 const flags=[];
 if(n.product==='poster'&&method==='offset')flags.push('offsetPoster');
 if(n.product==='trifold'&&stock.gsm>=200&&n.finish!=='crease')flags.push('crease');
 if(n.product==='poster'&&n.finish==='weather'&&n.stock!=='synth200')flags.push('outdoorSupport');
 if(n.product==='booklet'&&n.finish==='staple'&&n.pages>32)flags.push('stapleMax');
 return {qty,method,stock,baseSheets,days,prep,paper,print,fin,dispatch,rushExtra,totalCost,baseSale,sale,vat,gross,unitPrice:gross/qty,realMargin:sale>0?100*(sale-totalCost)/sale:0,profit:sale-totalCost,flags};
}
function initCase(c){
 const baseline=newSpec(c,true),rule=CHALLENGES[c.id];if(rule?.kind==='ask')Object.assign(baseline,rule.require);
 c.budget=Math.ceil(quote(baseline).gross*c.factor/5)*5;
 c.draft=null;c.variants=[];c.sent=null;c.status='pending';c.budgetRuleVersion=24;enrichCase(c);return c;
}
function makeSession(){
 const picks=[];for(const product of Object.keys(PRODUCTS)){picks.push(...shuffle(CASE_BANK.filter(c=>c.product===product)).slice(0,2))}
 // Cada jornada incluye al menos una consulta y una comparación, sin que todas las tareas lo requieran.
 for(const kind of ['ask','compare']){
  if(picks.some(c=>CHALLENGES[c.id]?.kind===kind))continue;
  const candidate=rand(CASE_BANK.filter(c=>CHALLENGES[c.id]?.kind===kind));
  const old=picks.find(c=>c.product===candidate.product&&!CHALLENGES[c.id]);
  if(old)picks[picks.indexOf(old)]=candidate;
 }
 return shuffle(picks).map(c=>initCase(structuredClone(c)));
}
function commercialBalance(c,s,q,stock){
 if(q.gross>c.budget+.005||q.realMargin<15-1e-7)return false;
 if(c.priority==='premium'||c.priority==='quality'){
  const gsm=PRODUCTS[s.product].stocks.map(id=>STOCKS[id].gsm),min=Math.min(...gsm),max=Math.max(...gsm);
  const materialUp=stock.gsm>min+(max-min)*.24;
  const finishUp=!!s.finish&&!['none','fold'].includes(s.finish);
  return materialUp||finishUp||(c.outdoor&&s.stock==='synth200');
 }
 if(c.priority==='economy')return q.gross<=c.budget*.96+0.005;
 return true;
}
function quantityFits(c,qty){
 // «Unos 850» permite una variación limitada; los demás pedidos solicitan cantidades concretas.
 return c.id==='t04'?Math.abs(qty-c.qty)<=Math.max(1,Math.round(c.qty*.05)):qty===c.qty;
}
function evaluationCore(c,s){
 const q=quote(s),p=PRODUCTS[s.product],stock=STOCKS[s.stock]||{gsm:0,eco:false};
 const correctProduct=s.product===c.product;
 if(!correctProduct)return {q,checks:[{id:'product',ok:false,w:100,key:'checkProduct',help:'explainProduct'}],score:0,passed:0,possible:1,critical:true};
 let technique=!!stock&&p.stocks.includes(s.stock)&&p.sizes.includes(s.size)&&p.finishes.includes(s.finish)&&!q.flags.length;
 if(c.color&&s.ink!=='color')technique=false;
 if(c.both&&Number(s.sides)!==2)technique=false;
 if(c.outdoor&&s.stock!=='synth200')technique=false;
 if(c.minGsm&&stock.gsm<c.minGsm)technique=false;
 if(c.finish&&s.finish!==c.finish)technique=false;
 if(c.shipping&&s.delivery!=='courier')technique=false;
 if(c.file==='missing'&&s.fileService!=='design')technique=false;
 if(c.file==='review'&&s.fileService==='none')technique=false;
 if(c.product==='booklet'&&Number(s.pages)!==Number(c.pages))technique=false;
 if(c.size&&s.size!==c.size)technique=false;
 if(askedCorrect(c)&&c.challenge.require)for(const [k,need] of Object.entries(c.challenge.require))if(String(s[k])!==String(need))technique=false;
 const qty=Number(s.quantity),quantityOk=quantityFits(c,qty);
 const checks=[
  {id:'product',ok:true,w:12,key:'checkProduct',help:'explainProduct'},
  {id:'quantity',ok:quantityOk,w:14,key:'checkQty',help:'explainQty',part:quantityOk?1:(c.id==='t04'?0:Math.abs(qty-c.qty)/c.qty<=.05?.35:0)},
  {id:'budget',ok:q.gross<=c.budget+.005,w:15,key:'checkBudget',help:'explainBudget'},
  {id:'deadline',ok:q.days<=c.deadline,w:12,key:'checkDeadline',help:'explainTime'},
  {id:'technique',ok:technique,w:21,key:'checkTechnique',help:'explainTechnique'},
  {id:'margin',ok:q.realMargin>=15-1e-7,w:10,key:'checkMargin',help:'explainMargin'},
  {id:'eco',ok:!c.eco||(stock.eco&&['none','fold','crease','staple'].includes(s.finish)),w:c.eco?9:0,key:'checkEco',help:'explainEco'},
  {id:'files',ok:c.file==='missing'?s.fileService==='design':c.file==='review'?s.fileService!=='none':true,w:9,key:'checkFiles',help:'explainFiles'},
  {id:'consult',ok:askedCorrect(c),w:c.challenge?.kind==='ask'?12:0,key:'consultReport',help:'missingConsult'},
  {id:'comparison',ok:compareDifferent(c)&&c.recommended!==null,w:c.challenge?.kind==='compare'?12:0,key:'comparisonReport',help:'missingCompare'},
  {id:'balance',ok:commercialBalance(c,s,q,stock),w:12,key:'balanceCheck',help:'balanceHelp'}
 ];
 const denom=checks.reduce((v,x)=>v+x.w,0),score=Math.max(0,Math.min(100,Math.round(checks.reduce((v,x)=>v+x.w*(x.ok?1:(x.part||0)),0)*100/denom)));
 return {q,checks,score,passed:checks.filter(x=>x.w>0&&x.ok).length,possible:checks.filter(x=>x.w>0).length,critical:false};
}
function evalQuote(c,s){return evaluationCore(c,s);}

function restore(){try{const raw=localStorage.getItem(STATE_KEY);if(!raw)return false;const x=JSON.parse(raw);if(!x||!Array.isArray(x.cases)||x.cases.length!==10||!x.student||!x.company||!I[x.lang])return false;

function selectOpts(options,value,trans=x=>x,allowBlank=false){const first=allowBlank?[`<option value="" ${value===''||value===null||value===undefined?'selected':''}>—</option>`]:[];return first.concat(options.map(x=>{const id=typeof x==='object'?x.id:x;return `<option value="${escapeHtml(id)}" ${String(id)===String(value)?'selected':''}>${escapeHtml(trans(x))}</option>`})).join('')}
function fieldSelect(key,label,opts,value,formatter=x=>x,optsAttr='',allowBlank=false){return `<div class="field"><label for="field_${key}">${label}</label><select id="field_${key}" data-spec="${key}" ${optsAttr}>${selectOpts(opts,value,formatter,allowBlank)}</select></div>`}
// Bloques de opciones enriquecidos por el mismo motor de presupuestación.
const PRICE_FIELDS=new Set(['size','stock','ink','sides','finish','method','pages','fileService','delivery','rush']);
const GUIDE_FIELDS={size:'guideSize',stock:'guideStock',ink:'guideInk',sides:'guideSides',finish:'guideFinish',method:'guideMethod',pages:'guidePages',fileService:'guideFile',delivery:'guideDelivery',rush:'guideRush'};
function comparisonValue(spec,key,id){const tentative={...spec,quantity:Math.max(1,Number(spec.quantity)||500)};tentative[key]=key==='rush'?String(id)==='true':key==='sides'||key==='pages'?Number(id):id;return quote(tentative).gross;}
function choicePriceMap(spec,key,ids){if(!PRICE_FIELDS.has(key))return null;const vals=ids.map(x=>comparisonValue(spec,key,x));const min=Math.min(...vals);return Object.fromEntries(ids.map((id,i)=>[String(id),Math.max(0,vals[i]-min)]));}
function formatChoiceDelta(delta){return delta<.005?t('optionCostBase'):'+'+money(delta);}
function fieldRadio(key,label,options,value,formatter=x=>x,full=false,spec=null){
 const ids=options.map(x=>typeof x==='object'?x.id:x), deltas=spec?choicePriceMap(spec,key,ids):null;
 return `<fieldset class="field choice-field${full?' wide':''}"><legend>${label}</legend><div class="choice-set" role="radiogroup" aria-label="${escapeHtml(label)}">${options.map((x,i)=>{const id=ids[i],checked=String(id)===String(value);return `<label class="choice-chip"><input type="radio" ${i===0?`id="field_${key}"`:''} name="spec_${key}" data-spec="${key}" value="${escapeHtml(id)}" ${checked?'checked':''}><span class="choice-copy"><span class="choice-name">${escapeHtml(formatter(x))}</span>${deltas?`<small class="choice-price" data-cost-key="${key}" data-cost-id="${escapeHtml(id)}">${formatChoiceDelta(deltas[String(id)])}</small>`:''}</span></label>`}).join('')}</div>${GUIDE_FIELDS[key]?`<div class="choice-guidance">${t(GUIDE_FIELDS[key])}</div>`:''}</fieldset>`;
}
function updateChoiceEstimates(c){if(!c||!c.draft)return;const elems=Array.from($('caseView').querySelectorAll('[data-cost-key]'));const groups=new Map();for(const el of elems){const key=el.dataset.costKey;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(el)}for(const [key,items] of groups){const deltas=choicePriceMap({...c.draft,product:c.draft.product||c.product},key,items.map(el=>el.dataset.costId));for(const item of items)item.textContent=formatChoiceDelta(deltas[item.dataset.costId]);}const ref=$('priceComparisonBasis');if(ref)ref.textContent=Number(c.draft.quantity)>0?t('optionCostReal'):t('optionCostSample');}

function fieldNumber(key,label,value,min,max,step=1,slider=false){return `<div class="field"><label for="field_${key}">${label}</label>${slider?`<div class="range-wrap"><input type="range" id="range_${key}" data-range="${key}" min="${min}" max="${max}" step="${step}" value="${value??min}" style="--pct:${Math.max(0,Math.min(100,((Number(value??min)-min)/(max-min||1))*100))}%"><input type="number" inputmode="numeric" id="field_${key}" data-spec="${key}" min="${min}" max="${max}" step="${step}" value="${value}"></div>`:`<input type="number" inputmode="numeric" id="field_${key}" data-spec="${key}" min="${min}" max="${max}" step="${step}" value="${value}">`}</div>`}
function fieldText(key,label,value,placeholder){return `<div class="field wide"><label for="field_${key}">${label}</label><textarea id="field_${key}" maxlength="800" placeholder="${escapeHtml(placeholder)}" data-spec="${key}">${escapeHtml(value)}</textarea><div class="small muted" style="margin-top:5px">${t('messageHint')}</div></div>`}
function priceBreakdown(q){return `<div class="cost-line"><span>${t('costPrep')}</span><strong class="num">${money(q.prep)}</strong></div><div class="cost-line"><span>${t('costPaper')}</span><strong class="num">${money(q.paper)}</strong></div><div class="cost-line"><span>${t('costPrint')}</span><strong class="num">${money(q.print)}</strong></div><div class="cost-line"><span>${t('costFin')}</span><strong class="num">${money(q.fin)}</strong></div><div class="cost-line"><span>${t('costDispatch')}</span><strong class="num">${money(q.dispatch+q.rushExtra)}</strong></div><div class="cost-line major"><span>${t('costTotal')}</span><strong class="num">${money(q.totalCost)}</strong></div>`}

}

function diagnose(c,s){
 const issues=[], add=(key,actual,better,critical=false)=>issues.push({key,actual,better,critical});
 const target=PRODUCTS[c.product],p=PRODUCTS[s.product],q=quote(s),stock=STOCKS[s.stock];
 if(s.product!==c.product){add(t('product'),tr(p.name),tr(target.name),true);return issues;}
 if(!quantityFits(c,Number(s.quantity)))add(t('quantity'),fmtNum(s.quantity),fmtNum(c.qty)+(c.id==='t04'?' ('+t('quantityApprox')+')':''));
 if(!p.sizes.includes(s.size)||c.size&&s.size!==c.size)add(t('format'),s.size||'—',c.size||p.default.size);
 if(!p.stocks.includes(s.stock))add(t('paper'),stock?tr(stock.name):'—',tr(STOCKS[p.stocks[0]].name));
 if(c.outdoor&&s.stock!=='synth200')add(t('paper'),tr(stock?.name||'—'),tr(STOCKS.synth200.name));
 else if(c.minGsm&&stock?.gsm<c.minGsm)add(t('paper'),tr(stock.name),`${c.minGsm} g/m² ${t('quantityApprox')} ${tr(L('como mínimo','com a mínim'))}`);
 if(c.eco&&!stock?.eco)add(t('paper'),tr(stock?.name||'—'),tr(L('Un soporte reciclado compatible','Un suport reciclat compatible')));
 if(c.color&&s.ink!=='color')add(t('ink'),t('bwPrint'),t('colorPrint'));
 if((c.both||p.sides.length===1)&&Number(s.sides)!==(c.both?2:p.sides[0]))add(t('side'),String(s.sides),String(c.both?2:p.sides[0]));
 if(c.finish&&s.finish!==c.finish)add(t('finish'),tr(FINISHES[s.finish]||L('—','—')),tr(FINISHES[c.finish]));
 if(s.product==='trifold'&&stock?.gsm>=200&&s.finish!=='crease')add(t('finish'),tr(FINISHES[s.finish]||L('—','—')),tr(FINISHES.crease));
 if(c.eco&&!['none','fold','crease','staple'].includes(s.finish))add(t('finish'),tr(FINISHES[s.finish]||L('—','—')),tr(L('Acabado sin plastificado ni procesos innecesarios','Acabat sense plastificat ni processos innecessaris')));
 if(s.product==='poster'&&s.method==='offset')add(t('method'),t('offset'),t('digital'));
 if(s.product==='poster'&&s.finish==='weather'&&s.stock!=='synth200')add(t('finish'),tr(FINISHES.weather),tr(L('Soporte sintético para protección exterior','Suport sintètic per a protecció exterior')));
 if(s.product==='booklet'&&Number(s.pages)!==Number(c.pages))add(t('pages'),String(s.pages),String(c.pages));
 if(s.product==='booklet'&&s.finish==='staple'&&s.pages>32)add(t('finish'),tr(FINISHES.staple),tr(FINISHES.spiral));
 if(c.shipping&&s.delivery!=='courier')add(t('delivery'),t('pickup'),t('courier'));
 if(c.file==='missing'&&s.fileService!=='design')add(t('artwork'),t({none:'without',check:'checkFile',adapt:'adaptFile',design:'designFile'}[s.fileService]||'without'),t('designFile'));
 if(c.file==='review'&&s.fileService==='none')add(t('artwork'),t('without'),t('checkFile'));
 if(c.challenge?.kind==='ask'&&!askedCorrect(c))add(t('consultReport'),t('detailNotYet'),t('missingConsult'));
 if(c.challenge?.kind==='ask'&&askedCorrect(c))for(const [k,v] of Object.entries(c.challenge.require||{})){
  if(String(s[k])!==String(v)){
   const key={ink:'ink',delivery:'delivery',finish:'finish'}[k]||k;
   const label={ink:v==='color'?t('colorPrint'):t('bwPrint'),delivery:v==='courier'?t('courier'):t('pickup'),finish:tr(FINISHES[v])}[k]||v;
   add(t(key),String(s[k]),label);
  }
 }
 if(c.challenge?.kind==='compare'&&(!compareDifferent(c)||c.recommended===null))add(t('comparisonReport'),t('detailNotYet'),t('comparisonNeed'));
 if(q.days>c.deadline)add(t('timeTitle'),`${q.days} ${t('timeDays')}`,`${c.deadline} ${t('timeDays')} · ${tr(L('revisa producción, acabado, mensajería o urgencia','revisa producció, acabat, missatgeria o urgència'))}`);
 if(q.gross>c.budget+.005)add(t('withTax'),money(q.gross),`${tr(L('Como máximo','Com a màxim'))} ${money(c.budget)} · ${tr(L('revisa costes, margen y plazo','revisa costs, marge i termini'))}`);
 if(q.realMargin<15-1e-7)add(t('actualMargin'),q.realMargin.toFixed(1)+' %',tr(L('Al menos el 15 % de margen real; revisa descuento y precio','Com a mínim el 15 % de marge real; revisa descompte i preu')));
 if((c.priority==='premium'||c.priority==='quality')&&!commercialBalance(c,s,q,stock)){
  const options=p.stocks.filter(id=>STOCKS[id].gsm>stock?.gsm);
  add(t('balanceCheck'),`${tr(stock?.name||L('—','—'))} · ${tr(FINISHES[s.finish])}`,options.length?`${tr(STOCKS[options[0]].name)} ${tr(L('o un acabado adecuado que aporte calidad','o un acabat adequat que aporti qualitat'))}`:tr(L('Valora un acabado justificado que aporte calidad sin superar el presupuesto','Valora un acabat justificat que aporti qualitat sense superar el pressupost')));
 }
 if(c.priority==='economy'&&q.gross>c.budget*.96+.005&&q.gross<=c.budget+.005)add(t('balanceCheck'),money(q.gross),tr(L('Aproxima la oferta al 96 % o menos del límite sin sacrificar el margen mínimo','Acosta l’oferta al 96 % o menys del límit sense sacrificar el marge mínim')));
 return issues;
}
function issueListHtml(issues,mode='boss'){
 if(!issues.length)return `<p class="boss-ok">✓ ${t(mode==='boss'?'bossAllGood':'bossGood')}</p>`;
 return `<div class="issue-list">${issues.map(x=>`<div class="issue-card ${x.critical?'critical':''}"><strong>${escapeHtml(x.key)}</strong><div><small>${t('choiceYour')}:</small> ${escapeHtml(x.actual)}</div><div><small>${t('choiceBetter')}:</small> ${escapeHtml(x.better)}</div></div>`).join('')}</div>`;
}
function bossReviewHtml(c){
 const s=c.draft||newSpec(c),missing=neededSpecs(s);
 if(missing.length){return `<p>${t('bossIncomplete')}</p><p class="boss-missing">${missing.map(k=>escapeHtml(t({size:'format',stock:'paper',ink:'ink',sides:'side',fileService:'artwork',method:'method',pages:'pages',rush:'rush',margin:'margin'}[k]||k))).join(' · ')}</p>`;}
 const issues=diagnose(c,s);return `<p>${t('bossIntro')}</p>${issueListHtml(issues)}${issues.length?`<p class="boss-ok">${t('bossGood')}</p>`:''}`;
}
function referenceSpec(c){
 const p=PRODUCTS[c.product],base=newSpec(c,true);
 base.quantity=c.qty;base.product=c.product;base.size=c.size||p.default.size;base.sides=c.both?2:p.sides[0];base.pages=c.pages||16;base.ink=c.color?'color':'bw';base.fileService=c.file==='missing'?'design':c.file==='review'?'check':'none';base.delivery=c.shipping?'courier':'pickup';base.note='';
 if(c.challenge?.kind==='ask')Object.assign(base,c.challenge.require);
 let best=null;let choices=0;
 const methodOpts=c.product==='poster'?['digital']:['digital','offset'];
 const finishList=p.finishes;
 for(const method of methodOpts)for(const stock of p.stocks)for(const finish of finishList)for(const rush of [false,true])for(const margin of [22,18,15,25,28,32,35,40,45]){
  const candidate={...base,method,stock,finish,rush,margin,discount:0};
  const e=evalQuote(c,candidate);choices++;
  if(!best||e.score>best.score||e.score===best.score&&e.q.profit>best.q.profit)best={spec:candidate,score:e.score,q:e.q};
  if(e.score===100&&margin>=22)return best;
 }
 return best;
}

 return `<details class="reference-details"><summary>✦ ${t('referenceTitle')} <span>${t('referenceScore')}: <b>${ref.score}/100</b></span></summary><p class="small muted">${t('referenceIntro')}</p><div class="reference-grid">${[
 [t('product'),tr(PRODUCTS[s.product].name)],[t('quantity'),fmtNum(s.quantity)],[t('format'),s.size],[t('paper'),tr(STOCKS[s.stock].name)],
 [t('ink'),s.ink==='color'?t('colorPrint'):t('bwPrint')],[t('method'),t(s.method)],[t('finish'),tr(FINISHES[s.finish])],
 [t('artwork'),t({none:'without',check:'checkFile',adapt:'adaptFile',design:'designFile'}[s.fileService])],
 [t('delivery'),t(s.delivery==='courier'?'courier':'pickup')],[t('rush'),t(s.rush?'yes':'no')],
 [t('margin'),s.margin+' %'],[t('discount'),s.discount+' %'],[t('withTax'),money(q.gross)],[t('actualMargin'),q.realMargin.toFixed(1)+' %'],[t('timeTitle'),q.days+' '+t('timeDays')]
 ].map(([k,v])=>`<div><span>${escapeHtml(k)}</span><strong>${escapeHtml(v)}</strong></div>`).join('')}</div></details>`;
}

function graphHtml(c,q){
 const chunks=[['productionLabel',q.prep,'#6374da'],['supportLabel',q.paper,'#18a999'],['printingLabel',q.print,'#f3b13d'],['finishingLabel',q.fin,'#cb75d9'],['deliveryLabel',q.dispatch+q.rushExtra,'#eb7e67']];
 let pc=0;const stops=chunks.map(([label,v,color])=>{const start=pc;pc+=v/Math.max(q.totalCost,.001)*100;return `${color} ${start.toFixed(2)}% ${pc.toFixed(2)}%`;});
 const used=q.gross/Math.max(c.budget,1)*100;
 return `<div class="finance-viz"><div class="visual-bars"><div class="visual-row"><span>${t('budgetProgress')}</span><strong>${used.toFixed(0)} %</strong></div><div class="thick-track"><span style="width:${Math.min(100,used)}%;background:${used>100?'#e3685e':'var(--brand)'}"></span></div><small>${money(q.gross)} / ${money(c.budget)}</small><div class="visual-row"><span>${t('profitRatio')}</span><strong>${q.realMargin.toFixed(1)} %</strong></div><div class="thick-track"><span style="width:${Math.max(0,Math.min(100,q.realMargin/50*100))}%"></span></div></div>
 <details class="cost-graph-details" open><summary>${t('newGraphsTitle')} <span>⌄</span></summary><div class="cost-donut-row"><div class="cost-donut" style="background:conic-gradient(${stops.join(',')})" role="img" aria-label="${t('costMixLabel')}"><div class="cost-donut-core"><strong>${money(q.totalCost)}</strong><small>${t('costTotal')}</small></div></div><div class="cost-legend">${chunks.map(([label,v,color])=>`<div><i style="background:${color}"></i><span>${t(label)}</span><b>${Math.round(v/Math.max(q.totalCost,.001)*100)} %</b></div>`).join('')}</div></div></details></div>`;
}
function pricePanelHtml(c,s){

 <div class="reportlist">${done.length?done.map((c,i)=>{const r=c.sent,q=r.evaluation.q,s=r.spec;return `<div class="card reportitem"><div style="display:flex;justify-content:space-between;gap:10px"><div><div class="eyebrow">${String(i+1).padStart(2,'0')} · ${escapeHtml(c.id.toUpperCase())}</div><h3>${escapeHtml(c.client)}</h3></div><span class="pill ${r.score>=80?'ok':r.score>=60?'warn':'bad'}">${r.score}/100</span></div><p>${tr(PRODUCTS[s.product].name)} · ${fmtNum(s.quantity)} · ${escapeHtml(s.size)} · ${tr(STOCKS[s.stock].name)}</p><p class="muted">${t('withTax')}: <strong>${money(q.gross)}</strong> · ${t('actualMargin')}: <strong>${q.realMargin.toFixed(1)} %</strong> · ${q.days} ${t('timeDays')}</p><p class="report-extra">${t('hintStatus')}: <b>${r.hintUsed?t('hintYes'):t('hintNo')}</b>${c.challenge?.kind==='ask'?` · ${t('consultReport')}: <b>${r.askedQuestions?.length||0} ${t('clientQuestion').toLowerCase()}(s)</b>`:''}${r.comparison?` · ${t('comparisonReport')}: <b>2</b> · ${t('comparisonChosen')}: <b>${t('option')} ${r.comparison.recommended+1}</b>`:''}</p>${r.schemaV25&&r.issues?.length?`<p class="report-extra">${t('reportReference')}: ${r.issues.slice(0,2).map(x=>escapeHtml(x.key)).join(' · ')}${r.issues.length>2?'…':''}</p>`:''}${s.note?`<p style="white-space:pre-wrap;margin-top:10px;border-left:2px solid var(--brand);padding-left:12px">${escapeHtml(s.note)}</p>`:''}<button class="btn btn-text btn-mini" data-open="${c.id}">${t('details')} →</button></div>`}).join(''):`<div class="empty">${t('reportNone')}</div>`}</div>
 <div class="card form-card"><h3>📑 ${t('viewReport')}</h3><p class="muted small">${t('pdfHint')}</p><div class="report-actions"><a class="btn btn-primary" id="pdfDownload" download="informe-prisma.pdf">${t('downloadPDF')}</a><a class="btn btn-light" id="pdfOpen" target="_blank" rel="noopener noreferrer">${t('openPDF')}</a><button class="btn btn-light" data-screen="list">${t('backBoard')}</button></div></div></div>`;
 prepareReportPdf();
}
// Generador PDF autónomo: no depende de window.print(), API, CDN ni librerías externas.
function pdfLatin(s){
 const replace={'‘':145,'’':146,'“':147,'”':148,'–':150,'—':151,'•':149,'€':128,'…':133,' ':32,'↔':45,'→':45,'←':45};let bytes=[];
 for(const ch of String(s??'')){
  let cp=ch.codePointAt(0);
  if(cp===10||cp===13||cp===9){bytes.push(32);continue}
  if((cp>=32&&cp<=126)||(cp>=160&&cp<=255)){bytes.push(cp);continue}
  if(Object.hasOwn(replace,ch)){bytes.push(replace[ch]);continue}
  if(cp>0xffff)continue;
  bytes.push(63);
 }
 return bytes;
}
function pdfHex(s){return pdfLatin(s).map(c=>c.toString(16).padStart(2,'0')).join('').toUpperCase()}
function pdfClean(s){return String(s??'').replace(/[\t\r]+/g,' ').replace(/[\u200b\u200e\u200f]/g,'').trim()}
function makePdf(mode='report',caseId=null){
 const W=595.28,H=841.89,LM=39,R=W-39,WIDTH=R-LM,foot=H-42;
 const brand=THEMES[state.theme??0][0],dark='#1e3241',muted='#586e79',ruleColor='#dce5e7',ink='#263843';
 const toRgb=c=>[1,3,5].map(i=>(parseInt(c.slice(i,i+2),16)/255).toFixed(3)).join(' ');
 const fm=n=>Number(n).toFixed(2);
 let pages=[],ops=[],y=85;let canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
 const push=s=>ops.push(s);
 function block(x,top,w,h,color){push(`${toRgb(color)} rg ${fm(x)} ${fm(H-top-h)} ${fm(w)} ${fm(h)} re f`)}
 function ruleAt(x,top,w,color=ruleColor){push(`${toRgb(color)} RG 0.65 w ${fm(x)} ${fm(H-top)} m ${fm(x+w)} ${fm(H-top)} l S`)}
 function text(s,x,top,size=10,bold=false,color=ink){push(`${toRgb(color)} rg BT /${bold?'F2':'F1'} ${fm(size)} Tf 1 0 0 1 ${fm(x)} ${fm(H-top-size)} Tm <${pdfHex(s)}> Tj ET`)}
 function wrap(s,width,size=9,bold=false){ctx.font=`${bold?'bold ':''}${size}px Arial`;let result=[];
  for(const par of pdfClean(s).split('\n')){if(!par.trim()){result.push('');continue}let current='';for(let word of par.trim().split(/\s+/)){let tryline=current?current+' '+word:word;
   if(ctx.measureText(tryline).width>width&&current){result.push(current);current=word}else current=tryline;
   while(ctx.measureText(current).width>width){let seg='',rest='';for(let i=0;i<current.length;i++){if(!rest&&ctx.measureText(seg+current[i]).width<=width)seg+=current[i];else rest+=current[i]}if(!seg)break;result.push(seg);current=rest}
  }if(current)result.push(current)}return result;
 }
 function newPage(){if(ops.length)pages.push(ops.join('\n'));ops=[];y=82;
  if(state.theme===null){['#db3b30','#ef7f1a','#f2c230','#48a64c','#2c7be5','#7a4dd8'].forEach((color,i)=>block(W*i/6,0,W/6+0.25,46,color))}else block(0,0,W,46,brand);text('PRISMA',LM,13,16,true,'#ffffff');text(mode==='single'?tr(L('PRESUPUESTO COMERCIAL','PRESSUPOST COMERCIAL')):tr(L('INFORME DE JORNADA','INFORME DE JORNADA')),W-224,18,9,true,'#ffffff');
  text(`${state.id}  |  ${state.student.slice(0,56)}`,LM,54,8,false,muted);ruleAt(LM,73,WIDTH);
 }
 function ensure(h=19){if(y+h>H-62)newPage()}
 function heading(s){ensure(37);block(LM,y,3,20,brand);text(s,LM+11,y+1,12,true,dark);y+=30}
 function para(s,size=9,opts={}){let x=opts.x??LM,width=opts.width??WIDTH,lh=size*1.46;for(const part of wrap(s,width,size,!!opts.bold)){ensure(lh+3);if(part)text(part,x,y,size,!!opts.bold,opts.color||ink);y+=lh}y+=5}
 function pair(k,v){let ks=String(k),vs=String(v);let lines=wrap(vs,WIDTH-151,9);ensure(18*lines.length+2);text(ks,LM,y,9,true,muted);lines.forEach((l,i)=>text(l,LM+151,y+i*13,9,false,dark));y+=Math.max(17,lines.length*13+5)}
 function rule(){ensure(14);ruleAt(LM,y,WIDTH);y+=14}
 function caseSection(c,idx){const s=c.sent.spec,q=c.sent.evaluation.q,ev=c.sent.evaluation;
  ensure(140);heading(`${idx}. ${c.client}  [${c.id.toUpperCase()}]`);
  para(tr(c.brief),8.7,{color:muted});
  pair(t('product'),tr(PRODUCTS[s.product].name));pair(t('quantity'),fmtNum(s.quantity));pair(t('format'),s.size);pair(t('paper'),tr(STOCKS[s.stock].name));
  pair(t('ink'),s.ink==='color'?t('colorPrint'):t('bwPrint'));pair(t('side'),Number(s.sides)===2?t('twoSide'):t('oneSide'));pair(t('finish'),tr(FINISHES[s.finish]));
  if(s.product==='booklet')pair(t('pages'),String(s.pages));
  pair(t('artwork'),t({none:'without',check:'checkFile',adapt:'adaptFile',design:'designFile'}[s.fileService]||'without'));
  pair(t('method'),s.method==='auto'?t('auto'):t(s.method));pair(t('delivery'),t(s.delivery==='courier'?'courier':'pickup'));
  pair(t('costTotal'),money(q.totalCost));pair(t('salePrice'),money(q.sale));pair(t('withTax'),money(q.gross));pair(t('clientBudget'),money(c.budget));pair(t('actualMargin'),q.realMargin.toFixed(1)+' %');pair(t('timeTitle'),q.days+' '+t('timeDays'));
  pair(t('score'),String(c.sent.score)+'/100');pair(t('hintStatus'),c.sent.hintUsed?t('hintYes'):t('hintNo'));if(c.sent.schemaV25){const flaws=c.sent.issues||diagnose(c,s);if(flaws.length){heading(t('reportReference'));for(const item of flaws){para(item.key+': '+item.actual+' -> '+item.better,8.5)}}else para(t('bossAllGood'),8.5,{color:muted});}
  if(c.challenge?.kind==='ask'){pair(t('consultReport'),(c.sent.askedQuestions||[]).length+' '+t('clientQuestion').toLowerCase()+'(s)');for(const i of (c.sent.askedQuestions||[])){const qa=c.challenge.questions[i];if(qa){para(t('clientQuestion')+': '+tr(qa[0]),8);para(t('clientReply')+': '+tr(qa[1]),8)}}}
  if(c.sent.comparison){pair(t('comparisonChosen'),t('option')+' '+(c.sent.comparison.recommended+1));for(const [i,alt] of c.sent.comparison.alternatives.entries()){pair(t('option')+' '+(i+1),tr(STOCKS[alt.spec.stock].name)+' / '+tr(FINISHES[alt.spec.finish])+' / '+money(alt.quote.gross));}}
  
  para(ev.checks.filter(x=>x.w>0).map(ch=>(ch.ok?'[OK] ':'[!] ')+t(ch.key)).join('  ·  '),8.3);
  if(s.note.trim()){para(t('message')+':',9,{bold:true});para(s.note,9)}else para(t('message')+': —',8.5,{color:muted});
  rule();
 }
 newPage();
 if(mode==='report'){
  const done=completed(),avg=done.length?Math.round(done.reduce((sum,c)=>sum+c.sent.score,0)/done.length):0,profit=done.reduce((sum,c)=>sum+c.sent.evaluation.q.profit,0),elapsed=state.start?Math.round((Date.now()-new Date(state.start).getTime())/60000):0;
  heading(t('reportTitle'));pair(t('studentLabel'),state.student);pair(t('companyLabel'),state.company);pair(t('session'),state.id);pair(t('reportTime'),`${Math.max(elapsed,1)} min`);pair(t('reportComplete'),`${done.length}/${state.cases.length}`);pair(t('reportScore'),`${avg}/100`);pair(t('reportProfit'),money(profit));
  para(t('reportLead'),9,{color:muted});para(t('costNotice'),8,{color:muted});
  if(done.length<state.cases.length)para(t('reportPartial'),9,{bold:true});
  done.forEach((c,i)=>caseSection(c,i+1));
  if(done.length===0){heading(t('noProposals'));para(t('reportNone'))}
 }else{
  const c=state.cases.find(x=>x.id===caseId);if(c&&c.sent){heading(t('offer'));pair(t('companyLabel'),state.company);pair(t('studentLabel'),state.student);pair(tr(L('CLIENTE','CLIENT')),c.client);pair(tr(L('REFERENCIA','REFERÈNCIA')),`${state.id}/${c.id}`);pair(tr(L('FECHA','DATA')),new Date(c.sent.at).toLocaleDateString(state.lang==='ca'?'ca-ES':'es-ES'));rule();
   const s=c.sent.spec,q=c.sent.evaluation.q;
   pair(t('product'),tr(PRODUCTS[s.product].name));pair(t('quantity'),fmtNum(s.quantity));pair(t('format'),s.size);pair(t('paper'),tr(STOCKS[s.stock].name));pair(t('ink'),s.ink==='color'?t('colorPrint'):t('bwPrint'));pair(t('finish'),tr(FINISHES[s.finish]));if(s.product==='booklet')pair(t('pages'),String(s.pages));pair(t('delivery'),t(s.delivery==='courier'?'courier':'pickup'));pair(t('timeTitle'),q.days+' '+t('timeDays'));rule();pair(t('salePrice'),money(q.sale));pair(t('vat'),money(q.vat));pair(t('withTax'),money(q.gross));if(s.note) {heading(t('message'));para(s.note)}
   para(tr(L('Presupuesto didáctico simulado, sin validez comercial.','Pressupost didàctic simulat, sense validesa comercial.')),8,{color:muted});
  }
 }
 if(ops.length)pages.push(ops.join('\n'));
 // PDF objects: content streams, fonts, catalog and page tree. All offsets in UTF-8 bytes.
 const enc=new TextEncoder(),objs=[];const add=s=>(objs.push(s),objs.length);
 const catalog=add(''),tree=add(''),font=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>'),bold=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
 const leaves=[];
 pages.forEach((content,i)=>{
  // Footer on every page.
  content+=`\n${toRgb(muted)} rg BT /F1 8 Tf 1 0 0 1 ${fm(LM)} 28 Tm <${pdfHex(`${state.id} · ${state.company}`)}> Tj ET\n`;
  content+=`${toRgb(muted)} rg BT /F1 8 Tf 1 0 0 1 ${fm(W-84)} 28 Tm <${pdfHex(`${i+1} / ${pages.length}`)}> Tj ET\n`;
  const stream=enc.encode(content);const contentId=add(`<< /Length ${stream.length} >>\nstream\n${content}endstream`);
  const leaf=add(`<< /Type /Page /Parent ${tree} 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 ${font} 0 R /F2 ${bold} 0 R >> >> /Contents ${contentId} 0 R >>`);leaves.push(leaf)
 });
 objs[catalog-1]=`<< /Type /Catalog /Pages ${tree} 0 R >>`;
 objs[tree-1]=`<< /Type /Pages /Kids [${leaves.map(n=>n+' 0 R').join(' ')}] /Count ${pages.length} >>`;
 const parts=['%PDF-1.4\n%Document PDF\n'],offsets=[0];let cursor=enc.encode(parts[0]).length;
 objs.forEach((v,i)=>{offsets.push(cursor);const obj=`${i+1} 0 obj\n${v}\nendobj\n`;parts.push(obj);cursor+=enc.encode(obj).length});const xref=cursor;
 parts.push(`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`);for(let i=1;i<offsets.length;i++)parts.push(`${String(offsets[i]).padStart(10,'0')} 00000 n \n`);
 parts.push(`trailer\n<< /Size ${objs.length+1} /Root ${catalog} 0 R >>\nstartxref\n${xref}\n%%EOF`);
 return new Blob(parts,{type:'application/pdf'});
}
function pdfFilename(type='informe',id=''){return `PRISMA_${type}_${(state.student||'alumno').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/gi,'_').slice(0,34)}_${state.id}${id?'_'+id:''}.pdf`}
function prepareReportPdf(){
 try{if(pdfReportUrl)URL.revokeObjectURL(pdfReportUrl);pdfReportUrl=URL.createObjectURL(makePdf('report'));
  const a=$('pdfDownload'),b=$('pdfOpen');if(a){a.href=pdfReportUrl;a.download=pdfFilename('informe')}if(b)b.href=pdfReportUrl;
 }catch(error){console.error(error);toast(t('pdfError'))}
}
function downloadSingle(){const c=state.cases.find(x=>x.id===state.active);if(!c||!c.sent)return;try{if(pdfQuoteUrl)URL.revokeObjectURL(pdfQuoteUrl);pdfQuoteUrl=URL.createObjectURL(makePdf('single',c.id));const a=document.createElement('a');a.href=pdfQuoteUrl;a.download=pdfFilename('presupuesto',c.id);document.body.appendChild(a);a.click();a.remove()}catch(error){console.error(error);toast(t('pdfError'))}}
// Eventos: un único manejador por raíz para evitar escuchadores duplicados al redibujar.

$('emojis').addEventListener('click',ev=>{const btn=ev.target.closest('[data-emoji]');if(!btn)return;const selected=Number(btn.dataset.emoji);state.emoji=state.emoji===selected?null:selected;renderPersonalization();setTheme()});

$('app').addEventListener('click',e=>{
 const closed=e.target.closest('[data-dismiss-tip]');if(closed){const id=closed.dataset.dismissTip;state.dismissedTips=state.dismissedTips||[];if(!state.dismissedTips.includes(id))state.dismissedTips.push(id);const parent=closed.closest('[data-tip]');if(parent)parent.remove();save();return;}
 const jump=e.target.closest('[data-jump-calculator]');if(jump){const price=$('livePricePanel');if(price)price.scrollIntoView({behavior:'smooth',block:'start'});return}
 const nav=e.target.closest('[data-filter]');if(nav){go('list',nav.dataset.filter);return}
 const screen=e.target.closest('[data-screen]');if(screen){go(screen.dataset.screen);return}
 const question=e.target.closest('[data-client-question]');if(question){askClient(Number(question.dataset.clientQuestion));return}
 const recommendation=e.target.closest('[data-recommend]');if(recommendation){recommendAlt(Number(recommendation.dataset.recommend));return}
 const summary=e.target.closest('#caseHintDetails summary');if(summary){const c=state.cases.find(x=>x.id===state.active);if(c&&!c.hintUsed){c.hintUsed=true;save();const symbol=summary.querySelector('.hint-symbol');if(symbol)symbol.textContent='✓';const badge=document.createElement('small');badge.textContent=t('hintUsed');summary.appendChild(badge);}}
 const op=e.target.closest('[data-open]');if(op){openCase(op.dataset.open);return}
 const alt=e.target.closest('[data-load]');if(alt){loadVariant(Number(alt.dataset.load));return}
 const rm=e.target.closest('[data-remove]');if(rm){removeVariant(Number(rm.dataset.remove));return}
 if(e.target.closest('#saveAlt')){saveVariant();return}
 if(e.target.closest('#submitQuote')){submitQuote();return}
 if(e.target.closest('#singlePdf')){downloadSingle();return}
});
$('app').addEventListener('change',e=>{if(!e.target.matches('[data-spec]'))return;if(['margin','discount','quantity'].includes(e.target.dataset.spec))return;handleSpecChange(e.target)});
$('app').addEventListener('input',e=>{if(e.target.matches('[data-range]')||['margin','discount','quantity'].includes(e.target.dataset.spec))liveNumericChange(e.target);else if(e.target.dataset.spec==='note')handleSpecChange(e.target)});

// Inicialización
renderPersonalization();applyTexts();if(restore())showApp();
})();
