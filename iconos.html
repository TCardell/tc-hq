<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>TC-HQ // Biblioteca de iconos</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0c0f;color:#e8e8ed;font:15px/1.5 system-ui,Segoe UI,sans-serif}header{position:sticky;top:0;background:#151619ed;backdrop-filter:blur(8px);border-bottom:1px solid #38383e;z-index:5;padding:18px max(20px,calc((100% - 1100px)/2));}h1{margin:0 0 5px;color:#e54650;letter-spacing:.06em;font:700 26px system-ui}p{margin:0 0 12px;color:#aba9b1;font-size:13px}nav{display:flex;flex-wrap:wrap;gap:7px}button{font:inherit;cursor:pointer}nav button{border:1px solid #44464b;border-radius:3px;background:#23252a;color:#e6e6e8;padding:5px 9px;font-size:12px}nav button.active,nav button:hover{background:#9c2935;color:#fff;border-color:#db3a47}main{max-width:1140px;margin:auto;padding:22px 20px 60px}.category{margin-bottom:30px}.category h2{font-size:15px;letter-spacing:.06em;font-weight:600;color:#e2e2e5;border-bottom:1px solid #34353a;padding-bottom:9px}.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}.item{min-height:112px;display:flex;flex-direction:column;gap:7px;align-items:center;justify-content:center;background:#1c1d21;border:1px solid #393a41;border-radius:3px;color:#ddd;transition:background .15s,border-color .15s}.item:hover,.item:focus-visible{border-color:#c83a44;background:#282126}.item:active{transform:translateY(1px)}.item .glyph{color:#dadadd;height:38px}.item code{font:11px ui-monospace,Consolas,monospace;color:#aaa;overflow-wrap:anywhere}.item:hover .glyph{color:#e74c55}footer{text-align:center;border-top:1px solid #292a2f;padding:18px;color:#98989d;font-size:12px}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#27282b;color:#f5f5f5;border:1px solid #c6404c;border-radius:3px;padding:9px 18px;z-index:10;display:none}#query{background:#212226;border:1px solid #535359;border-radius:3px;color:#eee;padding:10px 12px;max-width:100%;width:320px;margin:3px 0 14px;outline-color:#d8444c}@media(max-width:460px){header{padding:12px 15px}.items{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.item{min-height:94px}.item code{font-size:10px}main{padding:15px 9px}}
</style></head><body><header><h1>TC-HQ / ICON LIBRARY</h1><p><span id="icon-count-label">Biblioteca de iconos de TC-HQ · SVG vectoriales · Haz clic para copiar el identificador de programs.json</span></p><input id="query" type="search" aria-label="Buscar icono" placeholder="Buscar icono... (atom, flask, serigraphy)"><nav id="filters"></nav></header><main id="app"></main><div role="status" id="toast"></div><footer>TC/OS / TCardell Headquarters · <span id="footer-count"></span></footer><script type="module">
import {icon,ICON_GROUPS,ICON_NAMES} from './system/icons.js?v=174-iconpack2';
const $=id=>document.getElementById(id),q=$('query'),app=$('app'),filters=$('filters');let selected=-1;
let prefs={};try{prefs=JSON.parse(localStorage.getItem('tcos.preferences')||'{}')||{}}catch{}
const language=['es','en'].includes(prefs.language)?prefs.language:(/^es(?:-|$)/i.test(navigator.languages?.[0]||navigator.language||'en')?'es':'en');document.documentElement.lang=language;
const tr=(es,en)=>language==='en'?en:es;
$('icon-count-label').textContent=tr(`${ICON_NAMES.length} iconos disponibles en la biblioteca de TC-HQ · SVG vectoriales · Haz clic para copiar el identificador de programs.json`,`${ICON_NAMES.length} icons available in the TC-HQ library · Vector SVG · Click to copy the identifier for programs.json`);
$('footer-count').textContent=tr(`${ICON_NAMES.length} iconos disponibles para programas`,`${ICON_NAMES.length} program icons available`);
q.placeholder=tr('Buscar icono... (atom, flask, serigraphy)','Search icons... (atom, flask, serigraphy)');
q.setAttribute('aria-label',tr('Buscar icono','Search icon')); 
const but=(text,clicked)=>{const b=document.createElement('button');b.type='button';b.textContent=text;b.addEventListener('click',clicked);return b};
async function copy(id){try{await navigator.clipboard.writeText(id);show(tr('Copiado: ','Copied: ')+id)}catch{show(tr('Identificador: ','Identifier: ')+id+tr(' (selecciona y copia)',' (select and copy)'))}}
let hide;function show(t){const toast=$('toast');toast.textContent=t;toast.style.display='block';clearTimeout(hide);hide=setTimeout(()=>toast.style.display='none',1800)}
function render(){const query=q.value.toLowerCase().trim();app.replaceChildren();filters.replaceChildren();const all=but(tr('Todos','All')+' · '+ICON_NAMES.length,()=>{selected=-1;render()});all.classList.toggle('active',selected===-1);filters.append(all);
ICON_GROUPS.forEach((group,index)=>{const b=but(tr(group.es,group.en),()=>{selected=index;render()});b.classList.toggle('active',selected===index);filters.append(b)});
ICON_GROUPS.forEach((group,index)=>{if(selected!==-1&&selected!==index)return;const matches=group.icons.filter(id=>id.includes(query)||group.es.toLowerCase().includes(query)||group.en.toLowerCase().includes(query));if(!matches.length)return;const section=document.createElement('section');section.className='category';const h=document.createElement('h2');h.textContent=`${tr(group.es,group.en)} · ${matches.length}`;section.append(h);const grid=document.createElement('div');grid.className='items';matches.forEach(id=>{const b=document.createElement('button');b.type='button';b.className='item';b.title=tr('Copiar ','Copy ')+id;const glyph=document.createElement('span');glyph.className='glyph';glyph.innerHTML=icon(id,34);const c=document.createElement('code');c.textContent=id;b.append(glyph,c);b.addEventListener('click',()=>copy(id));grid.append(b)});section.append(grid);app.append(section)});
}
q.addEventListener('input',render);render();
</script></body></html>
